<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고객 대시보드</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --bg:#ffffff;
    --surface:#ffffff;
    --text:#1a1a1a;
    --text-muted:#767268;
    --border:#e9e6e1;
    --border-soft:#f1efeb;
    --accent:#0f9488;
    --accent-rgb:15,148,136;
    --accent-soft:rgba(15,148,136,0.12);
    --accent-soft-strong:rgba(15,148,136,0.38);
    --radius:16px;
    --shadow:0 1px 2px rgba(20,20,20,0.04), 0 10px 28px rgba(20,20,20,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.4;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:36px 20px 64px;}

  header{margin-bottom:28px;}
  header h1{font-size:22px;font-weight:800;letter-spacing:-0.02em;}
  header .header-sub{font-size:13px;color:var(--text-muted);margin-top:6px;}
  .hub-link{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12.5px;font-weight:600;color:var(--text-muted);
    text-decoration:none;margin-bottom:14px;
  }
  .hub-link:hover{color:var(--accent);}

  .section-title{font-size:15px;font-weight:700;margin-bottom:4px;letter-spacing:-0.01em;}
  .section-caption{font-size:11.5px;color:var(--text-muted);margin-bottom:16px;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- cards ---------- */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px;box-shadow:var(--shadow);animation:fadeUp .5s ease both;}
  .cards .card:nth-child(1){animation-delay:.02s;}
  .cards .card:nth-child(2){animation-delay:.06s;}
  .cards .card:nth-child(3){animation-delay:.10s;}
  .cards .card:nth-child(4){animation-delay:.14s;}
  .card-label{font-size:12.5px;color:var(--text-muted);font-weight:600;margin-bottom:10px;}
  .card-value{font-size:24px;font-weight:800;letter-spacing:-0.02em;word-break:break-all;}
  .card.total .card-value{font-size:30px;}
  .card-delta{font-size:12px;color:var(--text-muted);margin-top:8px;font-weight:600;}
  .card-delta .accent-text{color:var(--accent);}
  .spark-wrap{margin-top:12px;}
  .spark-svg{width:100%;height:32px;display:block;}
  .spark-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .spark-fill{fill:var(--accent-soft);}

  /* ---------- grids ---------- */
  .mid-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:20px;}
  .bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px 20px;animation:fadeUp .5s ease .18s both;}

  /* ---------- cohort table ---------- */
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .cohort-table{width:100%;border-collapse:collapse;min-width:520px;}
  .cohort-table th{font-size:11.5px;color:var(--text-muted);font-weight:700;text-align:center;
    padding:0 6px 10px;white-space:nowrap;}
  .cohort-table th:first-child{text-align:left;}
  .cohort-table td{font-size:12.5px;text-align:center;padding:10px 6px;border-radius:8px;font-weight:600;}
  .cohort-table td.cohort-month{text-align:left;font-weight:700;color:var(--text);padding-left:4px;
    border-radius:0;white-space:nowrap;}
  .cohort-table tr + tr td{padding-top:6px;}
  .cell-empty{background:var(--border-soft);color:#c3c0ba;font-weight:500;}

  /* ---------- donut ---------- */
  .donut-block{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center;}
  .donut-wrap{position:relative;width:154px;height:154px;flex-shrink:0;}
  .donut-svg{width:100%;height:100%;}
  .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;}
  .donut-total{font-size:22px;font-weight:800;letter-spacing:-0.02em;}
  .donut-total-label{font-size:11px;color:var(--text-muted);margin-top:2px;}
  .donut-legend{display:flex;flex-direction:column;gap:10px;min-width:150px;}
  .legend-item{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;gap:10px;}
  .legend-name{display:flex;align-items:center;gap:8px;color:var(--text);}
  .legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .legend-num{font-weight:700;color:var(--text);}
  .legend-divider{border-top:1px dashed var(--border);margin:2px 0;}
  .legend-ltv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-muted);}
  .legend-ltv b{color:var(--text);font-weight:800;}

  /* ---------- horizontal bars ---------- */
  .hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .hbar-row:last-child{margin-bottom:0;}
  .hbar-label{width:56px;font-size:12.5px;color:var(--text-muted);flex-shrink:0;}
  .hbar-track{flex:1;height:14px;background:var(--accent-soft);border-radius:8px;overflow:hidden;}
  .hbar-fill{height:100%;background:var(--accent);border-radius:8px;width:0%;transition:width .6s ease;}
  .hbar-value{width:50px;text-align:right;font-size:13px;font-weight:800;flex-shrink:0;}

  /* ---------- churn trend chart ---------- */
  .trend-legend{display:flex;gap:16px;font-size:12px;color:var(--text-muted);margin-bottom:12px;}
  .trend-legend span{display:flex;align-items:center;gap:6px;}
  .trend-swatch{width:16px;height:2px;background:var(--accent);display:inline-block;}
  .trend-swatch.dashed{background:none;border-top:2px dashed var(--accent);opacity:.65;}
  .trend-svg{width:100%;height:auto;display:block;}
  .trend-axis{stroke:var(--border);stroke-width:1;}
  .trend-axis-label{font-size:9px;fill:var(--text-muted);}
  .trend-line{stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none;}
  .trend-target{stroke:var(--accent);stroke-width:1.6;stroke-dasharray:6 5;opacity:.6;fill:none;}
  .trend-dot{fill:#fff;stroke:var(--accent);stroke-width:2;}

  .empty-msg{font-size:13px;color:var(--text-muted);padding:20px 0;text-align:center;}

  .status-msg{display:none;margin-top:20px;padding:14px 16px;border:1px solid var(--accent);
    background:var(--accent-soft);border-radius:10px;font-size:13px;color:#0a5c53;line-height:1.6;}
  .status-detail{display:block;opacity:.7;font-size:11px;margin-top:4px;}

  @media (max-width:960px){
    .cards{grid-template-columns:repeat(2,1fr);}
    .mid-grid{grid-template-columns:1fr;}
    .bottom-grid{grid-template-columns:1fr;}
  }
  @media (max-width:520px){
    .cards{grid-template-columns:1fr;}
    .wrap{padding:24px 14px 48px;}
    .card.total .card-value{font-size:26px;}
    .donut-block{flex-direction:column;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="hub-link" href="/">← 허브로 돌아가기</a>
    <h1>고객 대시보드</h1>
    <p class="header-sub">고객 수, 잔존율, 재구매 흐름을 한눈에 확인하세요.</p>
  </header>

  <section class="cards">
    <div class="card total">
      <div class="card-label">전체 고객 수</div>
      <div class="card-value" id="cardTotalValue">-</div>
    </div>
    <div class="card">
      <div class="card-label">재구매율 (6개월)</div>
      <div class="card-value" id="cardRepeatValue">-</div>
    </div>
    <div class="card">
      <div class="card-label">이탈률</div>
      <div class="card-value" id="cardChurnValue">-</div>
      <div class="card-delta" id="cardChurnDelta">불러오는 중...</div>
      <div class="spark-wrap" id="churnSpark"></div>
    </div>
    <div class="card">
      <div class="card-label">LTV</div>
      <div class="card-value" id="cardLtvValue">-</div>
      <div class="card-delta" id="cardLtvDelta">불러오는 중...</div>
      <div class="spark-wrap" id="ltvSpark"></div>
    </div>
  </section>

  <section class="mid-grid">
    <div class="panel">
      <h2 class="section-title">코호트 잔존율</h2>
      <p class="section-caption">유입 월 기준, N개월 뒤 남아있는 고객 비율</p>
      <div class="table-scroll">
        <table class="cohort-table" id="cohortTable">
          <thead></thead>
          <tbody><tr><td class="empty-msg">불러오는 중...</td></tr></tbody>
        </table>
      </div>
    </div>
    <div class="panel">
      <h2 class="section-title">고객 구성</h2>
      <p class="section-caption">customer_summary 데이터를 기반으로 추정한 구성이에요</p>
      <div class="donut-block" id="donutBlock">
        <div class="empty-msg">불러오는 중...</div>
      </div>
    </div>
  </section>

  <section class="bottom-grid">
    <div class="panel">
      <h2 class="section-title">기간별 재구매율</h2>
      <p class="section-caption">1 / 3 / 6 / 12개월 기준</p>
      <div id="repeatBars"><div class="empty-msg">불러오는 중...</div></div>
    </div>
    <div class="panel">
      <h2 class="section-title">월별 이탈률 추이</h2>
      <div class="trend-legend">
        <span><i class="trend-swatch"></i>실제 이탈률</span>
        <span><i class="trend-swatch dashed"></i>목표 이탈률</span>
      </div>
      <div id="churnTrend"><div class="empty-msg">불러오는 중...</div></div>
    </div>
  </section>

  <div id="statusMsg" class="status-msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  /*
    ▼▼▼ 아래 2줄만 본인 Supabase 정보로 바꿔주세요 ▼▼▼
    Supabase 대시보드 > Project Settings > API 에서 확인할 수 있어요.
    1) SUPABASE_URL      → https://mcypzsammvrthfqihkwy.supabase.co/rest/v1/
    2) SUPABASE_ANON_KEY → anon public key
  */
  const SUPABASE_URL = "https://mcypzsammvrthfqihkwy.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jeXB6c2FtbXZydGhmcWloa3d5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzOTk1NzcsImV4cCI6MjEwMTk3NTU3N30.oUcfA-F0S9QHgpK56qvB0-aczx7AMPXDCtkVtNrJ3QM";

  // 이탈률 목표선(%) - 필요하면 이 숫자만 바꾸세요
  const CHURN_TARGET = 5.0;

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* ---------- 유틸 ---------- */
  const ACCENT_RGB = '15,148,136';
  const fmtWon = (n) => '₩' + Math.round(n || 0).toLocaleString('ko-KR');
  const fmtNum = (n) => Math.round(n || 0).toLocaleString('ko-KR');
  const fmtPct = (n, d = 1) => (isFinite(n) ? n.toFixed(d) : '0.0') + '%';

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, (m) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }
  function emptyMsg(t) { return `<div class="empty-msg">${escapeHtml(t)}</div>`; }

  function isConfigured() {
    return SUPABASE_URL !== "https://your-project.supabase.co" &&
           SUPABASE_ANON_KEY !== "your-anon-key" &&
           SUPABASE_URL.startsWith('http');
  }
  function showStatus(html) {
    const el = document.getElementById('statusMsg');
    el.innerHTML = html;
    el.style.display = 'block';
  }
  function hideStatus() { document.getElementById('statusMsg').style.display = 'none'; }
  function showError(e) {
    console.error(e);
    showStatus(`⚠️ 데이터를 불러오지 못했어요. Supabase URL/키, 테이블명·컬럼명을 확인해 주세요.
      <span class="status-detail">${escapeHtml(e?.message || e)}</span>`);
  }

  /* ---------- 카드 + 스파크라인 ---------- */
  function renderSparkline(containerId, values) {
    const el = document.getElementById(containerId);
    if (!values || values.length < 2) { el.innerHTML = ''; return; }

    const W = 200, H = 32, pad = 4;
    const min = Math.min(...values), max = Math.max(...values);
    const range = (max - min) || 1;
    const stepX = (W - pad * 2) / (values.length - 1);

    const pts = values.map((v, i) => {
      const x = pad + stepX * i;
      const y = pad + (1 - (v - min) / range) * (H - pad * 2);
      return [x, y];
    });

    const linePath = 'M ' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L ');
    const fillPath = linePath + ` L ${pts[pts.length - 1][0].toFixed(1)} ${H} L ${pts[0][0].toFixed(1)} ${H} Z`;

    el.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" class="spark-svg" preserveAspectRatio="none">
        <path d="${fillPath}" class="spark-fill"></path>
        <path d="${linePath}" class="spark-line"></path>
      </svg>`;
  }

  function renderCards(summaryRows, repeatRows) {
    if (!summaryRows.length) return;
    const latest = summaryRows[summaryRows.length - 1];
    const prev = summaryRows.length > 1 ? summaryRows[summaryRows.length - 2] : null;

    document.getElementById('cardTotalValue').textContent = fmtNum(latest.total_customers);

    const repeat6 = repeatRows.find(r => r.period === '6개월');
    document.getElementById('cardRepeatValue').textContent = repeat6 ? fmtPct(repeat6.rate) : '-';

    document.getElementById('cardChurnValue').textContent = fmtPct(latest.churn_rate);
    const churnDeltaEl = document.getElementById('cardChurnDelta');
    if (prev) {
      const d = latest.churn_rate - prev.churn_rate;
      const arrow = d >= 0 ? '▲' : '▼';
      churnDeltaEl.innerHTML = `<span class="accent-text">${arrow} ${Math.abs(d).toFixed(1)}%p</span> 전월 대비`;
    } else {
      churnDeltaEl.textContent = '전월 데이터 없음';
    }

    document.getElementById('cardLtvValue').textContent = fmtWon(latest.ltv);
    const ltvDeltaEl = document.getElementById('cardLtvDelta');
    if (prev) {
      const d = latest.ltv - prev.ltv;
      const arrow = d >= 0 ? '▲' : '▼';
      ltvDeltaEl.innerHTML = `<span class="accent-text">${arrow} ${fmtWon(Math.abs(d))}</span> 전월 대비`;
    } else {
      ltvDeltaEl.textContent = '전월 데이터 없음';
    }

    const last6 = summaryRows.slice(-6);
    renderSparkline('churnSpark', last6.map(r => Number(r.churn_rate) || 0));
    renderSparkline('ltvSpark', last6.map(r => Number(r.ltv) || 0));
  }

  /* ---------- 코호트 잔존율 표 ---------- */
  function renderCohort(rows) {
    const table = document.getElementById('cohortTable');
    const thead = table.querySelector('thead');
    const tbody = table.querySelector('tbody');

    if (!rows || !rows.length) {
      tbody.innerHTML = `<tr><td>${emptyMsg('코호트 데이터가 없어요')}</td></tr>`;
      return;
    }

    const COLS = [0, 1, 2, 3, 4, 5];
    thead.innerHTML = `<tr><th>유입 월</th>${COLS.map(c => `<th>M+${c}</th>`).join('')}</tr>`;

    const cohortOrder = [];
    const cohortMap = {};
    rows.forEach(r => {
      const key = r.cohort_month;
      if (!cohortMap[key]) { cohortMap[key] = {}; cohortOrder.push(key); }
      cohortMap[key][r.months_after] = Number(r.retention);
    });

    const bodyHtml = cohortOrder.map(month => {
      const cells = COLS.map(c => {
        const v = cohortMap[month][c];
        if (v === undefined) return `<td class="cell-empty">-</td>`;
        const alpha = Math.min(Math.max(0.15 + (v / 100) * 0.65, 0.15), 0.85);
        const color = alpha > 0.5 ? '#ffffff' : 'var(--text)';
        return `<td style="background:rgba(${ACCENT_RGB},${alpha.toFixed(2)});color:${color}">${v.toFixed(0)}%</td>`;
      }).join('');
      return `<tr><td class="cohort-month">${escapeHtml(month)}</td>${cells}</tr>`;
    }).join('');

    tbody.innerHTML = bodyHtml;
  }

  /* ---------- 고객 구성 도넛 ---------- */
  function renderDonut(summaryRows) {
    const wrap = document.getElementById('donutBlock');
    if (!summaryRows.length) { wrap.innerHTML = emptyMsg('데이터가 없어요'); return; }

    const latest = summaryRows[summaryRows.length - 1];
    const prev = summaryRows.length > 1 ? summaryRows[summaryRows.length - 2] : null;

    const currTotal = Number(latest.total_customers) || 0;
    const newC = Number(latest.new_customers) || 0;
    let retained, reactivated;

    if (prev) {
      const prevTotal = Number(prev.total_customers) || 0;
      const churned = prevTotal * ((Number(latest.churn_rate) || 0) / 100);
      retained = Math.max(prevTotal - churned, 0);
      if (retained + newC > currTotal) retained = Math.max(currTotal - newC, 0);
      reactivated = Math.max(currTotal - newC - retained, 0);
    } else {
      retained = Math.max(currTotal - newC, 0);
      reactivated = 0;
    }

    const segments = [
      { label: '재구매 고객', value: retained, opacity: 1 },
      { label: '신규', value: newC, opacity: 0.55 },
      { label: '휴면 복귀', value: reactivated, opacity: 0.28 }
    ];
    const total = segments.reduce((a, s) => a + s.value, 0) || 1;

    const r = 50, cx = 60, cy = 60;
    const circumference = 2 * Math.PI * r;
    let cumulative = 0;
    const arcs = segments.map(s => {
      const frac = s.value / total;
      const len = frac * circumference;
      const dashoffset = -cumulative;
      cumulative += len;
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
        stroke="rgba(${ACCENT_RGB},${s.opacity})" stroke-width="16"
        stroke-dasharray="${len.toFixed(1)} ${(circumference - len).toFixed(1)}"
        stroke-dashoffset="${dashoffset.toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
    }).join('');

    const legendHtml = segments.map(s => `
      <div class="legend-item">
        <span class="legend-name">
          <span class="legend-dot" style="background:rgba(${ACCENT_RGB},${s.opacity})"></span>${s.label}
        </span>
        <span class="legend-num">${fmtNum(s.value)}명 · ${fmtPct((s.value / total) * 100)}</span>
      </div>`).join('');

    wrap.innerHTML = `
      <div class="donut-wrap">
        <svg viewBox="0 0 120 120" class="donut-svg">
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(${ACCENT_RGB},0.08)" stroke-width="16"></circle>
          ${arcs}
        </svg>
        <div class="donut-center">
          <div class="donut-total">${fmtNum(currTotal)}</div>
          <div class="donut-total-label">전체 고객</div>
        </div>
      </div>
      <div class="donut-legend">
        ${legendHtml}
        <div class="legend-divider"></div>
        <div class="legend-ltv"><span>평균 LTV</span><b>${fmtWon(latest.ltv)}</b></div>
      </div>`;
  }

  /* ---------- 기간별 재구매율 가로 막대 ---------- */
  function renderRepeatBars(rows) {
    const el = document.getElementById('repeatBars');
    if (!rows || !rows.length) { el.innerHTML = emptyMsg('데이터가 없어요'); return; }

    const max = Math.max(...rows.map(r => Number(r.rate) || 0), 1);
    el.innerHTML = rows.map(r => `
      <div class="hbar-row">
        <div class="hbar-label">${escapeHtml(r.period)}</div>
        <div class="hbar-track"><div class="hbar-fill" style="width:${((Number(r.rate) || 0) / max * 100).toFixed(1)}%"></div></div>
        <div class="hbar-value">${fmtPct(r.rate)}</div>
      </div>`).join('');
  }

  /* ---------- 월별 이탈률 추이 (목표선 포함) ---------- */
  function renderChurnTrend(rows) {
    const wrap = document.getElementById('churnTrend');
    if (!rows || !rows.length) { wrap.innerHTML = emptyMsg('데이터가 없어요'); return; }

    const W = 560, H = 220, padL = 34, padR = 14, padT = 16, padB = 30;
    const chartW = W - padL - padR;
    const chartH = H - padT - padB;
    const n = rows.length;
    const stepX = n > 1 ? chartW / (n - 1) : 0;

    const values = rows.map(r => Number(r.churn_rate) || 0);
    const maxY = Math.max(...values, CHURN_TARGET) * 1.2 || 1;

    const yOf = (v) => padT + chartH - (v / maxY) * chartH;
    const pts = values.map((v, i) => [padL + stepX * i, yOf(v)]);

    const linePath = 'M ' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L ');
    const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" class="trend-dot"></circle>`).join('');
    const labels = rows.map((r, i) => `<text x="${(padL + stepX * i).toFixed(1)}" y="${H - 8}" text-anchor="middle" class="trend-axis-label">${escapeHtml(r.month)}</text>`).join('');

    const targetY = yOf(CHURN_TARGET);

    wrap.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" class="trend-svg" preserveAspectRatio="xMidYMid meet">
        <line x1="${padL}" y1="${padT + chartH}" x2="${W - padR}" y2="${padT + chartH}" class="trend-axis"></line>
        <line x1="${padL}" y1="${targetY.toFixed(1)}" x2="${W - padR}" y2="${targetY.toFixed(1)}" class="trend-target"></line>
        <path d="${linePath}" class="trend-line"></path>
        ${dots}
        ${labels}
      </svg>`;
  }

  /* ---------- 데이터 로드 ---------- */
  async function loadDashboard() {
    if (!isConfigured()) {
      showStatus('⚙️ 코드 상단의 SUPABASE_URL과 SUPABASE_ANON_KEY를 본인의 Supabase 정보로 바꿔주세요.');
      return;
    }
    try {
      const [suRes, coRes, reRes] = await Promise.all([
        db.from('customer_summary').select('*').order('sort_order', { ascending: true }),
        db.from('customer_cohort').select('*').order('sort_order', { ascending: true }),
        db.from('customer_repeat').select('*').order('sort_order', { ascending: true })
      ]);
      if (suRes.error) throw suRes.error;
      if (coRes.error) throw coRes.error;
      if (reRes.error) throw reRes.error;

      const summaryRows = suRes.data || [];
      const cohortRows = coRes.data || [];
      const repeatRows = reRes.data || [];

      hideStatus();
      renderCards(summaryRows, repeatRows);
      renderCohort(cohortRows);
      renderDonut(summaryRows);
      renderRepeatBars(repeatRows);
      renderChurnTrend(summaryRows);
    } catch (e) {
      showError(e);
    }
  }

  document.addEventListener('DOMContentLoaded', loadDashboard);
</script>
</body>
</html>
