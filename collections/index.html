<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채권 현황</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root{
    --bg:#ffffff;
    --surface:#ffffff;
    --text:#1a1a1a;
    --text-muted:#767268;
    --border:#e9e6e1;
    --border-soft:#f1efeb;
    --accent:#4f46e5;
    --accent-rgb:79,70,229;
    --accent-soft:rgba(79,70,229,0.12);
    --radius:16px;
    --shadow:0 1px 2px rgba(20,20,20,0.04), 0 10px 28px rgba(20,20,20,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.4;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:36px 20px 64px;}

  .hub-link{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12.5px;font-weight:600;color:var(--text-muted);
    text-decoration:none;margin-bottom:20px;
  }
  .hub-link:hover{color:var(--accent);}

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
    margin-bottom:24px;padding:14px 18px;background:var(--border-soft);border-radius:12px;
  }
  .toolbar-info{font-size:12.5px;color:var(--text-muted);font-weight:600;}
  .toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-primary, .btn-secondary{
    font-family:inherit;font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:999px;
    cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:disabled{background:var(--border);color:var(--text-muted);cursor:not-allowed;}
  .btn-secondary{background:#fff;color:var(--text);border-color:var(--border);}
  .btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
  .btn-secondary:disabled{opacity:.5;cursor:not-allowed;}

  header{margin-bottom:28px;}
  header h1{font-size:22px;font-weight:800;letter-spacing:-0.02em;}
  header .header-sub{font-size:13px;color:var(--text-muted);margin-top:6px;}

  .view-header{margin-bottom:20px;}
  .back-link{
    display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;
    color:var(--text-muted);text-decoration:none;cursor:pointer;margin-bottom:10px;
  }
  .back-link:hover{color:var(--accent);}
  .view-title{font-size:20px;font-weight:800;letter-spacing:-0.01em;}

  .section-title{font-size:15px;font-weight:700;margin-bottom:16px;letter-spacing:-0.01em;}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px 20px;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- company cards ---------- */
  .company-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;}
  .company-card{
    cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px 20px;box-shadow:var(--shadow);animation:fadeUp .5s ease both;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .company-card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(20,20,20,0.06), 0 16px 32px rgba(20,20,20,0.08);}
  .company-grid .company-card:nth-child(1){animation-delay:.02s;}
  .company-grid .company-card:nth-child(2){animation-delay:.06s;}
  .company-grid .company-card:nth-child(3){animation-delay:.10s;}
  .company-name{font-size:16px;font-weight:800;letter-spacing:-0.01em;}
  .company-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:8px;}
  .icon-btn{
    background:none;border:none;color:var(--text-muted);font-size:13px;cursor:pointer;
    padding:3px 7px;border-radius:6px;line-height:1;flex-shrink:0;
  }
  .icon-btn:hover{background:var(--border-soft);color:#b91c1c;}
  .company-stat-row{display:flex;gap:24px;margin-bottom:16px;}
  .company-stat .stat-label{font-size:11.5px;color:var(--text-muted);margin-bottom:4px;font-weight:600;}
  .company-stat .stat-value{font-size:18px;font-weight:800;letter-spacing:-0.01em;}
  .status-chip-row{display:flex;gap:6px;flex-wrap:wrap;}

  .status-chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;
    font-size:11px;font-weight:700;white-space:nowrap;}
  .status-chip.apply{background:rgba(var(--accent-rgb),0.13);color:var(--accent);}
  .status-chip.progress{background:rgba(var(--accent-rgb),0.32);color:var(--accent);}
  .status-chip.done{background:var(--accent);color:#fff;}

  .status-select{
    font-family:inherit;font-size:11.5px;font-weight:700;padding:5px 8px;border-radius:999px;
    border:1px solid transparent;cursor:pointer;
  }
  .status-select.apply{background:rgba(var(--accent-rgb),0.13);color:var(--accent);}
  .status-select.progress{background:rgba(var(--accent-rgb),0.32);color:var(--accent);}
  .status-select.done{background:var(--accent);color:#fff;}
  .status-select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .status-select:disabled{opacity:.6;cursor:wait;}

  /* ---------- empty state ---------- */
  .empty-state{grid-column:1/-1;text-align:center;padding:56px 20px;}
  .empty-state-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:6px;}
  .empty-state-sub{font-size:13px;color:var(--text-muted);}

  /* ---------- case list ---------- */
  .filter-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .filter-tab{
    font-family:inherit;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;
    border:1px solid var(--border);background:#fff;color:var(--text-muted);cursor:pointer;
  }
  .filter-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .data-table{width:100%;border-collapse:collapse;min-width:640px;}
  .data-table th{font-size:11.5px;color:var(--text-muted);font-weight:700;text-align:left;
    padding:0 12px 10px;white-space:nowrap;}
  .data-table th:nth-child(4){text-align:right;}
  .data-table td{font-size:13.5px;padding:13px 12px;border-bottom:1px solid var(--border-soft);
    white-space:nowrap;}
  .data-table td:nth-child(4){text-align:right;font-weight:700;}
  .data-table td.td-remark{white-space:normal;max-width:200px;color:var(--text-muted);padding:6px 8px;}
  .remark-input{
    font-family:inherit;font-size:12.5px;padding:6px 7px;border:1px solid transparent;
    border-radius:6px;width:100%;background:transparent;color:var(--text-muted);
  }
  .remark-input:hover{background:var(--border-soft);}
  .remark-input:focus{outline:none;border-color:var(--accent);background:#fff;color:var(--text);}
  .remark-textarea{
    font-family:inherit;font-size:13.5px;padding:9px 10px;border:1px solid var(--border);
    border-radius:8px;width:100%;min-height:60px;resize:vertical;color:var(--text);
  }
  .remark-textarea:focus{outline:none;border-color:var(--accent);}
  .data-table tr:last-child td{border-bottom:none;}
  .data-table tbody tr{cursor:pointer;transition:background .1s ease;}
  .data-table tbody tr:hover{background:var(--border-soft);}
  .td-name{font-weight:700;}

  /* ---------- case detail ---------- */
  .case-info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;}
  .info-label{font-size:11.5px;color:var(--text-muted);margin-bottom:6px;font-weight:600;}
  .info-value{font-size:15px;font-weight:800;letter-spacing:-0.01em;}

  .timeline{position:relative;padding-left:22px;}
  .timeline::before{content:'';position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:var(--border);}
  .timeline-item{position:relative;padding-bottom:22px;}
  .timeline-item:last-child{padding-bottom:0;}
  .timeline-dot{position:absolute;left:-22px;top:3px;width:10px;height:10px;border-radius:50%;
    background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 1px var(--border);}
  .timeline-date{font-size:12.5px;font-weight:800;margin-right:8px;}
  .timeline-note{font-size:13px;color:var(--text-muted);margin-top:6px;line-height:1.6;}

  .empty-msg{font-size:13px;color:var(--text-muted);padding:20px 0;text-align:center;}

  .status-msg{display:none;margin-top:20px;padding:14px 16px;border:1px solid var(--accent);
    background:var(--accent-soft);border-radius:10px;font-size:13px;color:#3730a3;line-height:1.6;}
  .status-msg.error{border-color:#dc2626;background:#fef2f2;color:#991b1b;}
  .status-detail{display:block;opacity:.7;font-size:11px;margin-top:4px;}

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,20,20,0.45);
    display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;
  }
  .modal-box{
    background:#fff;border-radius:16px;max-width:420px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,0.22);max-height:90vh;overflow-y:auto;
  }
  .modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border);}
  .modal-title{font-size:15px;font-weight:800;}
  .modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
  .form-row{display:flex;flex-direction:column;gap:6px;}
  .form-row label{font-size:12px;font-weight:700;color:var(--text-muted);}
  .form-row input, .form-row select, .form-row textarea{
    font-family:inherit;font-size:13.5px;padding:9px 12px;border:1px solid var(--border);
    border-radius:8px;color:var(--text);width:100%;
  }
  .form-row input:disabled{background:var(--border-soft);color:var(--text-muted);}
  .form-row textarea{resize:vertical;font-family:inherit;}
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus{outline:none;border-color:var(--accent);}
  .modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;border-top:1px solid var(--border);}


  /* ---------- 미수현황 ---------- */
  :root{
    --cat1:#2a78d6; --cat2:#eb6834; --cat3:#1baf7a; --cat4:#eda100; --cat-normal:#e9e6e1;
    --warn-bg:#fff7e6; --warn-text:#8a5300; --ok-bg:#ecfdf3; --ok-text:#067647;
  }
  .page-section{margin-bottom:44px;}
  .section-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
  .section-head h2{font-size:18px;font-weight:800;letter-spacing:-0.01em;margin:0;}
  .section-head .header-sub{margin-top:4px;margin-bottom:0;font-size:13px;color:var(--text-muted);}
  .section-divider{border:none;border-top:1px solid var(--border);margin:0 0 36px;}
  .ar-select{font-family:inherit;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--text);cursor:pointer;}
  .ar-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px;}
  .ar-kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 18px;}
  .ar-kpi .stat-label{font-size:11.5px;color:var(--text-muted);font-weight:600;margin-bottom:6px;}
  .ar-kpi .stat-value{font-size:22px;font-weight:800;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;}
  .ar-kpi .stat-value small{font-size:13px;font-weight:700;color:var(--text-muted);margin-left:2px;}
  .ar-kpi .stat-sub{font-size:11.5px;color:var(--text-muted);margin-top:4px;font-variant-numeric:tabular-nums;}
  @media (max-width:820px){.ar-kpis{grid-template-columns:repeat(2,minmax(0,1fr));}}
  .ar-panel{margin-bottom:16px;}
  .ar-panel-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px 16px;margin-bottom:14px;}
  .ar-panel-head .section-title{margin:0;}
  .ar-panel-head p{margin:0;font-size:12px;color:var(--text-muted);}
  .ar-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:14px;}
  .ar-legend span{display:inline-flex;align-items:center;gap:6px;}
  .ar-sw{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .ar-bars{display:flex;flex-direction:column;gap:18px;}
  .ar-bar-row{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 16px;align-items:center;}
  .ar-bar-name{font-weight:800;font-size:14px;}
  .ar-track{height:24px;display:flex;gap:2px;}
  .ar-seg{height:100%;min-width:0;}
  .ar-seg:first-child{border-radius:4px 0 0 4px;}
  .ar-seg:last-child{border-radius:0 4px 4px 0;}
  .ar-seg:only-child{border-radius:4px;}
  .ar-bar-meta{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
  .ar-bar-meta b{color:var(--text);}
  @media (max-width:640px){.ar-bar-row{grid-template-columns:1fr;}.ar-bar-meta{grid-column:1;}}
  .ar-tip{position:fixed;pointer-events:none;background:#1a1a1a;color:#fff;font-size:12px;padding:8px 10px;border-radius:8px;z-index:200;line-height:1.5;max-width:260px;display:none;}
  .ar-table{width:100%;border-collapse:collapse;font-size:13px;}
  .ar-table th{font-size:11.5px;color:var(--text-muted);font-weight:700;text-align:left;padding:0 10px 10px;white-space:nowrap;border-bottom:1px solid var(--border);}
  .ar-table td{padding:11px 10px;border-bottom:1px solid var(--border-soft);vertical-align:top;}
  .ar-table .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .ar-table tr.total td{font-weight:800;border-top:1px solid var(--border);border-bottom:none;}
  .ar-table .cnt{color:var(--text-muted);font-size:11.5px;margin-left:4px;font-weight:600;}
  .ar-table td.note{min-width:150px;max-width:300px;color:var(--text-muted);white-space:pre-wrap;word-break:keep-all;font-size:12.5px;}
  .ar-table td.co{white-space:nowrap;}
  .ar-table td.td-name{min-width:140px;}
  .ar-scroll{max-height:560px;overflow:auto;}
  .ar-scroll .ar-table th{position:sticky;top:0;background:#fff;padding-top:4px;}
  .ar-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap;}
  .ar-pill::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--pc);}
  .ar-controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .ar-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .ar-chip{font-family:inherit;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .ar-chip.active{border-color:var(--text);color:var(--text);background:var(--border-soft);}
  .ar-search{font-family:inherit;font-size:12.5px;padding:8px 12px;border:1px solid var(--border);border-radius:999px;width:200px;max-width:100%;}
  .ar-search:focus{outline:none;border-color:var(--accent);}
  .ar-checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px;margin-top:12px;}
  .ar-check{min-width:0;border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;}
  .ar-check h3{margin:0;font-size:13.5px;font-weight:800;}
  .ar-check .line{display:flex;justify-content:space-between;gap:12px;min-width:0;}
  .ar-check .line span{min-width:0;overflow-wrap:anywhere;}
  .ar-check .line span:first-child{color:var(--text-muted);white-space:nowrap;}
  .ar-flag{border-radius:8px;padding:6px 10px;font-size:12px;line-height:1.5;}
  .ar-flag.warn{background:var(--warn-bg);color:var(--warn-text);}
  .ar-flag.ok{background:var(--ok-bg);color:var(--ok-text);}
  details.ar-details summary{cursor:pointer;font-size:14px;font-weight:700;}
  .ar-rule{font-size:12.5px;color:var(--text-muted);line-height:1.7;margin-top:12px;}
  .ar-rule ol{margin:4px 0 0;padding-left:20px;}
  .ar-delta{font-size:11.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .ar-delta.up{color:#b42318;}
  .ar-delta.down{color:#067647;}
  .ar-delta.flat{color:var(--text-muted);}
  .ar-kpi .stat-delta{margin-top:6px;font-size:12px;color:var(--text-muted);}
  .ar-new{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:999px;background:#fef3f2;color:#b42318;vertical-align:1px;}
  .ar-foot{font-size:12px;color:var(--text-muted);margin-top:10px;}
  .ar-table tr.grp-row th{border-bottom:none;padding-bottom:2px;}
  .ar-table th.grp{text-align:center;}
  .ar-msg{display:none;margin-bottom:16px;padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.6;background:var(--warn-bg);color:var(--warn-text);}

  @media (max-width:640px){
    .wrap{padding:24px 14px 48px;}
    .company-stat-row{gap:16px;}
    .toolbar{flex-direction:column;align-items:flex-start;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="hub-link" href="/">← 허브로 돌아가기</a>

  <!-- ===== View 1: 채권 현황 (미수현황 + 채권추심 내역) ===== -->
  <div id="viewCompanies">
    <header>
      <h1>채권 현황</h1>
      <p class="header-sub">회사별 미수현황과 채권추심 진행 내역을 확인하세요.</p>
    </header>

    <!-- ----- 미수현황 ----- -->
    <section class="page-section" id="arSection" aria-labelledby="arTitle">
      <div class="section-head">
        <div>
          <h2 id="arTitle">미수현황</h2>
          <p class="header-sub" id="arSub">불러오는 중...</p>
        </div>
        <div class="toolbar-actions">
          <select class="ar-select" id="arMonth" aria-label="기준월 선택" onchange="arSelectMonth(this.value)"></select>
          <label class="btn-primary" for="arFileInput" id="arUploadLabel">미회수 파일 업로드</label>
          <input type="file" id="arFileInput" accept=".xlsx,.xlsm,.xls" multiple onchange="arHandleFiles(event)" hidden>
        </div>
      </div>
      <div class="ar-msg" id="arMsg"></div>
      <div id="arBody"><div class="empty-msg">불러오는 중...</div></div>
    </section>

    <hr class="section-divider">

    <!-- ----- 채권추심 내역 ----- -->
    <section class="page-section" aria-labelledby="collTitle">
      <div class="section-head">
        <div>
          <h2 id="collTitle">채권추심 내역</h2>
          <p class="header-sub">회사별 채권추심 신청 · 진행 · 종료 현황입니다.</p>
        </div>
      </div>
      <div class="toolbar">
        <div class="toolbar-info" id="lastUpdated">불러오는 중...</div>
        <div class="toolbar-actions">
          <button class="btn-secondary" id="resetAllBtn" onclick="resetAll()">전체 초기화</button>
          <button class="btn-secondary" onclick="downloadTemplate()">양식 다운로드</button>
          <label class="btn-primary" for="fileInput" id="uploadLabel">엑셀 업로드</label>
          <input type="file" id="fileInput" accept=".xlsx,.xls" onchange="handleFile(event)" hidden>
        </div>
      </div>
      <div class="company-grid" id="companyGrid"><div class="empty-msg">불러오는 중...</div></div>
    </section>
  </div>

  <!-- ===== View 2: 회사별 사건 목록 ===== -->
  <div id="viewCases" style="display:none">
    <div class="view-header" style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;">
      <div>
        <a class="back-link" onclick="showCompanies()">← 채권 현황</a>
        <div class="view-title" id="caseListTitle">-</div>
      </div>
      <div class="toolbar-actions">

<script>
  /*
    ▼▼▼ 아래 2줄만 본인 Supabase 정보로 바꿔주세요 (다른 대시보드와 같은 프로젝트를 쓰고 있다면 그대로 두셔도 돼요) ▼▼▼

  const SUPABASE_URL = "https://mcypzsammvrthfqihkwy.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jeXB6c2FtbXZydGhmcWloa3d5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzOTk1NzcsImV4cCI6MjEwMTk3NTU3N30.oUcfA-F0S9QHgpK56qvB0-aczx7AMPXDCtkVtNrJ3QM";

  /*
    Supabase에 두 테이블이 있어야 해요: collection_case, collection_progress
    (같이 드린 collections_supabase.sql을 Supabase SQL Editor에서 먼저 실행해주세요)

    엑셀 업로드 형식은 그대로입니다. 파일 안에 시트 2개가 있어야 해요.
    [시트1 "사건"] 채권자 | 사건번호 | 회사명 | 사업자등록번호 | 대표자명 | 금액 | 상태 | 신청일자 | 비고 | 종료일자
    [시트2 "진행경과"] 사건번호 | 경과일자 | 상태 | 내용

    - "사건번호"는 같은 회사 안에서만 겹치지 않으면 됩니다.
    - "상태"는 신청 / 진행중 / 종료 중 하나로 적어주세요.
    - ★ 업로드하면, 파일 속 "사건번호"가 이미 있는 사건은 내용이 갱신되고, 없는 사건번호는 새로 추가됩니다.
      파일에 없는 기존 사건은 삭제되지 않아요.
    - 이제 데이터는 Supabase(공유 서버)에 저장되므로, PC·휴대폰 등 어떤 기기로 접속해도 같은 내용이 보여요.
  */

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const COMPANY_ORDER = ['대상국제교역', '(주)디아이화스너', '픽스글로벌'];

  let allCases = [];
  let allProgress = [];
  let currentCompany = null;
  let currentCaseNo = null;
  let currentFilter = '전체';
  let modalMode = 'add';
  let modalEditingCaseNo = null;

  /* ---------- 유틸 ---------- */
  const fmtWon = (n) => '₩' + Math.round(n || 0).toLocaleString('ko-KR');
  const fmtNum = (n) => Math.round(n || 0).toLocaleString('ko-KR');

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, (m) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }
  function jsStr(s) { return String(s ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
  function emptyMsg(t) { return `<div class="empty-msg">${escapeHtml(t)}</div>`; }

  function showStatus(html, isError) {
    const el = document.getElementById('statusMsg');
    el.innerHTML = html;
    el.className = 'status-msg' + (isError ? ' error' : '');
    el.style.display = 'block';
  }
  function hideStatus() { document.getElementById('statusMsg').style.display = 'none'; }
  function showError(e, prefix) {
    console.error(e);
    showStatus(`⚠️ ${prefix || '처리 중 문제가 발생했어요.'}
      <span class="status-detail">${escapeHtml(e?.message || e)}</span>`, true);
  }

  function setBusy(busy) {
    document.getElementById('resetAllBtn').disabled = busy;
    document.getElementById('uploadLabel').style.pointerEvents = busy ? 'none' : '';
    document.getElementById('uploadLabel').style.opacity = busy ? .6 : 1;
  }

  function updateLastUpdatedLabel() {
    const el = document.getElementById('lastUpdated');
    const s = new Date().toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    el.textContent = `최근 불러온 시각: ${s}`;
  }

  function statusClass(status) {
    return status === '신청' ? 'apply' : status === '진행중' ? 'progress' : 'done';
  }
  function statusChip(status) {
    return `<span class="status-chip ${statusClass(status)}">${escapeHtml(status || '-')}</span>`;
  }
  function buildStatusSelect(c) {
    const opts = ['신청', '진행중', '종료'].map(s =>
      `<option value="${s}" ${c.status === s ? 'selected' : ''}>${s}</option>`
    ).join('');
    return `<select class="status-select ${statusClass(c.status)}"
      onclick="event.stopPropagation()"
      onchange="changeCaseStatus('${jsStr(c.case_no)}', this.value)">${opts}</select>`;
  }

  function sortCompanies(list) {
    return [...list].sort((a, b) => {
      const ia = COMPANY_ORDER.indexOf(a), ib = COMPANY_ORDER.indexOf(b);
      if (ia === -1 && ib === -1) return a.localeCompare(b);
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });
  }

  // 회사명 표기 차이("(주)" 유무, 공백, 특수기호 등)를 무시하고 같은 회사로 인식시킴
  function companyMatchKey(s) {
    return String(s ?? '')
      .normalize('NFC')
      .replace(/주식회사/g, '')
      .replace(/\(\s*주\s*\)/g, '')
      .replace(/（\s*주\s*）/g, '')
      .replace(/[㈜㈱]/g, '')
      .replace(/[（）()]/g, '')
      .replace(/\s+/g, '')
      .trim();
  }
  function normalizeCompanyName(raw) {
    const key = companyMatchKey(raw);
    const known = COMPANY_ORDER.find(c => companyMatchKey(c) === key);
    if (known) return known;
    return String(raw ?? '')
      .normalize('NFC')
      .replace(/[（]/g, '(')
      .replace(/[）]/g, ')')
      .trim()
      .replace(/\s+/g, ' ');
  }

  function excelDateToStr(v) {
    if (v === null || v === undefined || v === '') return '';
    if (v instanceof Date) return v.toISOString().slice(0, 10);
    if (typeof v === 'number') {
      const ms = Math.round((v - 25569) * 86400 * 1000);
      return new Date(ms).toISOString().slice(0, 10);
    }
    return String(v).trim();
  }
  function toNumber(v) {
    if (v === null || v === undefined || v === '') return 0;
    if (typeof v === 'number') return v;
    return Number(String(v).replace(/,/g, '').trim()) || 0;
  }
  function toDateOrNull(v) { return v ? v : null; }
  function generateCaseNo() {
    return 'm' + Date.now() + Math.floor(Math.random() * 1000);
  }

  /* ---------- Supabase 읽기 (1000행 제한 대비 페이지네이션) ---------- */
  async function fetchAllRows(table) {
    let out = [];
    let from = 0;
    const pageSize = 1000;
    while (true) {
      const { data, error } = await db.from(table).select('*').range(from, from + pageSize - 1);
      if (error) throw error;
      out = out.concat(data || []);
      if (!data || data.length < pageSize) break;
      from += pageSize;
    }
    return out;
  }

  async function loadFromSupabase() {
    const [cases, progress] = await Promise.all([
      fetchAllRows('collection_case'),
      fetchAllRows('collection_progress')
    ]);
    allCases = cases.map(c => ({ ...c, creditor_company: normalizeCompanyName(c.creditor_company) }));
    allProgress = progress.map(p => ({ ...p, creditor_company: normalizeCompanyName(p.creditor_company) }));
    updateLastUpdatedLabel();
  }

  /* ---------- 엑셀 → 데이터 변환 ---------- */
  function normalizeCase(row) {
    return {
      creditor_company: normalizeCompanyName(row['채권자']),
      case_no: String(row['사건번호'] ?? '').trim(),
      company_name: String(row['회사명'] ?? '').trim(),
      business_reg_no: String(row['사업자등록번호'] ?? '').trim(),
      representative_name: String(row['대표자명'] ?? '').trim(),
      amount: toNumber(row['금액']),
      status: String(row['상태'] ?? '신청').trim() || '신청',
      apply_date: toDateOrNull(excelDateToStr(row['신청일자'])),
      remark: String(row['비고'] ?? '').trim(),
      close_date: toDateOrNull(excelDateToStr(row['종료일자']))
    };
  }
  function normalizeProgress(row) {
    return {
      case_no: String(row['사건번호'] ?? '').trim(),
      progress_date: toDateOrNull(excelDateToStr(row['경과일자'])),
      status: String(row['상태'] ?? '').trim(),
      note: String(row['내용'] ?? '').trim()
    };
  }

  function handleFile(evt) {
    const file = evt.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        setBusy(true);
        showStatus('엑셀 파일을 읽는 중...');

        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: 'array', cellDates: true });

        const caseSheetName = wb.SheetNames.find(n => n.includes('사건')) || wb.SheetNames[0];
        const progressSheetName = wb.SheetNames.find(n => n.includes('경과')) || wb.SheetNames[1];

        const caseRows = caseSheetName ? XLSX.utils.sheet_to_json(wb.Sheets[caseSheetName], { defval: '' }) : [];
        const progressRows = progressSheetName ? XLSX.utils.sheet_to_json(wb.Sheets[progressSheetName], { defval: '' }) : [];

        const newCases = caseRows.map(normalizeCase).filter(c => c.company_name);
        if (!newCases.length) throw new Error('사건 시트에서 유효한 행을 찾지 못했어요.');

        // 사건번호 -> 채권자 매핑 (같은 파일 안의 진행경과를 회사에 연결하기 위함)
        const caseNoToCompany = {};
        newCases.forEach(c => { caseNoToCompany[c.case_no] = c.creditor_company; });

        const newProgress = progressRows
          .map(normalizeProgress)
          .filter(p => p.case_no)
          .map(p => ({ ...p, creditor_company: caseNoToCompany[p.case_no] || '' }))
          .filter(p => p.creditor_company);

        showStatus('Supabase에 저장하는 중...');

        // 사건번호가 이미 있으면 갱신, 없으면 새로 추가 (다른 사건은 그대로 유지)
        const { error: upsertErr } = await db.from('collection_case')
          .upsert(newCases, { onConflict: 'creditor_company,case_no' });
        if (upsertErr) throw upsertErr;

        // 진행경과는 기록이라 지우지 않고 계속 쌓음
        if (newProgress.length) {
          const { error: progErr } = await db.from('collection_progress').insert(newProgress);
          if (progErr) throw progErr;
        }

        await loadFromSupabase();

        // 업로드 내용 검증: 금액이 죄다 0원이거나, 상태값이 신청/진행중/종료가 아닌 경우 경고
        const zeroAmountCount = newCases.filter(c => c.amount === 0).length;
        const unknownStatuses = [...new Set(newCases.filter(c => !['신청', '진행중', '종료'].includes(c.status)).map(c => c.status))];
        const warnings = [];
        if (zeroAmountCount === newCases.length) {
          warnings.push('금액이 전부 0원으로 들어왔어요. 엑셀의 금액 열 이름이 정확히 "금액"인지 확인해 주세요.');
        } else if (zeroAmountCount > 0) {
          warnings.push(`${zeroAmountCount}건은 금액이 0원으로 들어왔어요. 해당 행의 금액 값을 확인해 주세요.`);
        }
        if (unknownStatuses.length) {
          warnings.push(`"${escapeHtml(unknownStatuses.join(', '))}" 상태는 신청/진행중/종료 중 하나가 아니에요. 값은 저장되지만 집계·필터에 정확히 반영되지 않을 수 있어요.`);
        }

        if (warnings.length) {
          showStatus(`⚠️ 업로드는 됐지만 확인이 필요해요.<br>${warnings.join('<br>')}`, true);
        } else {
          hideStatus();
        }
        showCompanies();
        renderCompanies();
      } catch (err) {
        showError(err, '엑셀 업로드에 실패했어요. 양식(시트 이름·열 이름)과 Supabase 연결을 확인해 주세요.');
      } finally {
        setBusy(false);
        evt.target.value = '';
      }
    };
    reader.onerror = () => { showStatus('파일을 읽지 못했어요.', true); setBusy(false); };
    reader.readAsArrayBuffer(file);
  }

  function downloadTemplate() {
    const caseHeaders = ['채권자', '사건번호', '회사명', '사업자등록번호', '대표자명', '금액', '상태', '신청일자', '비고', '종료일자'];
    const caseSample = [
      ['대상국제교역', '1', '(주)한빛물산', '123-45-67890', '김한빛', 15000000, '진행중', '2026-03-05', '1차 내용증명 발송 완료', '']
    ];
    const progHeaders = ['사건번호', '경과일자', '상태', '내용'];
    const progSample = [
      ['1', '2026-03-05', '신청', '채권추심 신청 접수'],
      ['1', '2026-03-20', '진행중', '채무자 내용증명 발송']
    ];

    const wb = XLSX.utils.book_new();
    const ws1 = XLSX.utils.aoa_to_sheet([caseHeaders, ...caseSample]);
    const ws2 = XLSX.utils.aoa_to_sheet([progHeaders, ...progSample]);
    XLSX.utils.book_append_sheet(wb, ws1, '사건');
    XLSX.utils.book_append_sheet(wb, ws2, '진행경과');
    XLSX.writeFile(wb, '채권추심_업로드양식.xlsx');
  }

  async function resetAll() {
    if (!confirm('정말 Supabase에 저장된 모든 데이터를 삭제할까요? 이 작업은 되돌릴 수 없어요.')) return;
    try {
      setBusy(true);
      showStatus('전체 데이터를 삭제하는 중...');
      const { error: e1 } = await db.from('collection_progress').delete().gte('id', 0);
      if (e1) throw e1;
      const { error: e2 } = await db.from('collection_case').delete().gte('id', 0);
      if (e2) throw e2;
      await loadFromSupabase();
      hideStatus();
      showCompanies();
      renderCompanies();
    } catch (err) {
      showError(err, '전체 초기화에 실패했어요.');
    } finally {
      setBusy(false);
    }
  }

  async function deleteCompany(name, opts) {
    if (!confirm(`"${name}" 데이터를 전부 삭제할까요?`)) return;
    try {
      setBusy(true);
      showStatus(`"${name}" 데이터를 삭제하는 중...`);
      const { error: e1 } = await db.from('collection_progress').delete().eq('creditor_company', name);
      if (e1) throw e1;
      const { error: e2 } = await db.from('collection_case').delete().eq('creditor_company', name);
      if (e2) throw e2;
      await loadFromSupabase();
      hideStatus();
      if (opts && opts.goToOverview) showCompanies();
      renderCompanies();
    } catch (err) {
      showError(err, '회사 데이터 삭제에 실패했어요.');
    } finally {
      setBusy(false);
    }
  }

  async function deleteCase(caseNo) {
    if (!caseNo) return;
    if (!confirm('이 사건을 삭제할까요? 진행 경과 기록도 함께 삭제됩니다.')) return;
    try {
      setBusy(true);
      showStatus('사건을 삭제하는 중...');
      const { error: e1 } = await db.from('collection_progress')
        .delete().eq('creditor_company', currentCompany).eq('case_no', caseNo);
      if (e1) throw e1;
      const { error: e2 } = await db.from('collection_case')
        .delete().eq('creditor_company', currentCompany).eq('case_no', caseNo);
      if (e2) throw e2;
      await loadFromSupabase();
      hideStatus();
      showCases(currentCompany);
    } catch (err) {
      showError(err, '사건 삭제에 실패했어요.');
    } finally {
      setBusy(false);
    }
  }

  async function changeCaseStatus(caseNo, newStatus) {
    const c = allCases.find(x => x.case_no === caseNo && x.creditor_company === currentCompany);
    if (!c) return;
    const oldStatus = c.status;
    if (oldStatus === newStatus) return;

    let closeDate = c.close_date;
    if (newStatus === '종료' && !closeDate) closeDate = new Date().toISOString().slice(0, 10);
    if (oldStatus === '종료' && newStatus !== '종료') closeDate = null;

    try {
      setBusy(true);
      const { error: e1 } = await db.from('collection_case')
        .update({ status: newStatus, close_date: closeDate })
        .eq('creditor_company', currentCompany).eq('case_no', caseNo);
      if (e1) throw e1;

      const { error: e2 } = await db.from('collection_progress').insert({
        case_no: caseNo,
        creditor_company: currentCompany,
        progress_date: new Date().toISOString().slice(0, 10),
        status: newStatus,
        note: `상태 변경: ${oldStatus} → ${newStatus}`
      });
      if (e2) throw e2;

      await loadFromSupabase();
      if (document.getElementById('viewCaseDetail').style.display !== 'none') {
        showCaseDetail(caseNo);
      } else {
        renderCaseListHeader();
        renderCaseTable();
      }
    } catch (err) {
      showError(err, '상태 변경에 실패했어요.');
    } finally {
      setBusy(false);
    }
  }

  async function updateRemark(caseNo, value) {
    const v = value.trim();
    const idx = allCases.findIndex(x => x.case_no === caseNo && x.creditor_company === currentCompany);
    if (idx === -1) return;
    if (allCases[idx].remark === v) return;
    allCases[idx].remark = v; // 화면은 즉시 반영
    try {
      const { error } = await db.from('collection_case')
        .update({ remark: v })
        .eq('creditor_company', currentCompany).eq('case_no', caseNo);
      if (error) throw error;
    } catch (err) {
      showError(err, '비고 저장에 실패했어요. 다시 시도해 주세요.');
    }
  }

  function openAddCaseModal() {
    modalMode = 'add';
    modalEditingCaseNo = null;
    document.getElementById('modalTitle').textContent = '새 사건 추가';
    document.getElementById('modalSubmitBtn').textContent = '추가';
    document.getElementById('formCreditor').value = currentCompany;
    document.getElementById('formCompanyName').value = '';
    document.getElementById('formBizNo').value = '';
    document.getElementById('formRep').value = '';
    document.getElementById('formAmount').value = '';
    document.getElementById('formStatus').value = '신청';
    document.getElementById('formApplyDate').value = new Date().toISOString().slice(0, 10);
    document.getElementById('formRemark').value = '';
    document.getElementById('formCloseDate').value = '';
    document.getElementById('addCaseModal').style.display = 'flex';
  }

  function openEditCaseModal(caseNo) {
    const c = allCases.find(x => x.case_no === caseNo && x.creditor_company === currentCompany);
    if (!c) return;
    modalMode = 'edit';
    modalEditingCaseNo = caseNo;
    document.getElementById('modalTitle').textContent = '사건 정보 수정';
    document.getElementById('modalSubmitBtn').textContent = '저장';
    document.getElementById('formCreditor').value = c.creditor_company;
    document.getElementById('formCompanyName').value = c.company_name;
    document.getElementById('formBizNo').value = c.business_reg_no || '';
    document.getElementById('formRep').value = c.representative_name || '';
    document.getElementById('formAmount').value = c.amount || '';
    document.getElementById('formStatus').value = c.status;
    document.getElementById('formApplyDate').value = c.apply_date || '';
    document.getElementById('formRemark').value = c.remark || '';
    document.getElementById('formCloseDate').value = c.close_date || '';
    document.getElementById('addCaseModal').style.display = 'flex';
  }

  function closeAddCaseModal() {
    document.getElementById('addCaseModal').style.display = 'none';
  }

  async function submitCaseForm() {
    const companyName = document.getElementById('formCompanyName').value.trim();
    const amount = toNumber(document.getElementById('formAmount').value);
    if (!companyName) { alert('회사명을 입력해주세요.'); return; }
    if (!amount) { alert('채권 금액을 입력해주세요.'); return; }

    const status = document.getElementById('formStatus').value;
    const applyDate = document.getElementById('formApplyDate').value || new Date().toISOString().slice(0, 10);
    const closeDate = document.getElementById('formCloseDate').value || null;
    const remark = document.getElementById('formRemark').value.trim();
    const bizNo = document.getElementById('formBizNo').value.trim();
    const rep = document.getElementById('formRep').value.trim();
    const today = new Date().toISOString().slice(0, 10);

    const submitBtn = document.getElementById('modalSubmitBtn');
    submitBtn.disabled = true;

    try {
      if (modalMode === 'edit') {
        const { error: e1 } = await db.from('collection_case').update({
          company_name: companyName,
          business_reg_no: bizNo,
          representative_name: rep,
          amount: amount,
          status: status,
          apply_date: applyDate,
          remark: remark,
          close_date: closeDate
        }).eq('creditor_company', currentCompany).eq('case_no', modalEditingCaseNo);
        if (e1) throw e1;

        const { error: e2 } = await db.from('collection_progress').insert({
          case_no: modalEditingCaseNo,
          creditor_company: currentCompany,
          progress_date: today,
          status: status,
          note: '사건 정보 수정'
        });
        if (e2) throw e2;
      } else {
        const newCaseNo = generateCaseNo();
        const { error: e1 } = await db.from('collection_case').insert({
          creditor_company: currentCompany,
          case_no: newCaseNo,
          company_name: companyName,
          business_reg_no: bizNo,
          representative_name: rep,
          amount: amount,
          status: status,
          apply_date: applyDate,
          remark: remark,
          close_date: closeDate
        });
        if (e1) throw e1;

        const { error: e2 } = await db.from('collection_progress').insert({
          case_no: newCaseNo,
          creditor_company: currentCompany,
          progress_date: applyDate,
          status: status,
          note: '채권추심 신청 접수'
        });
        if (e2) throw e2;
      }

      const editedCaseNo = modalEditingCaseNo;
      await loadFromSupabase();
      closeAddCaseModal();

      if (modalMode === 'edit' && document.getElementById('viewCaseDetail').style.display !== 'none') {
        showCaseDetail(editedCaseNo);
      } else {
        renderCaseListHeader();
        renderCaseTable();
      }
    } catch (err) {
      showError(err, modalMode === 'edit' ? '사건 수정에 실패했어요.' : '사건 추가에 실패했어요.');
    } finally {
      submitBtn.disabled = false;
    }
  }

  /* ---------- 화면 전환 ---------- */
  function showView(id) {
    ['viewCompanies', 'viewCases', 'viewCaseDetail'].forEach(v => {
      document.getElementById(v).style.display = (v === id) ? '' : 'none';
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function showCompanies() {
    currentCompany = null;
    showView('viewCompanies');
  }
  function showCases(companyName) {
    currentCompany = companyName;
    currentFilter = '전체';
    document.querySelectorAll('.filter-tab').forEach(el => {
      el.classList.toggle('active', el.dataset.status === '전체');
    });
    showView('viewCases');
    renderCaseListHeader();
    renderCaseTable();
  }
  function setFilter(status) {
    currentFilter = status;
    document.querySelectorAll('.filter-tab').forEach(el => {
      el.classList.toggle('active', el.dataset.status === status);
    });
    renderCaseTable();
  }

  /* ---------- 회사 카드 ---------- */
  function renderCompanies() {
    const grid = document.getElementById('companyGrid');
    if (!allCases.length) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-title">아직 데이터가 없어요</div>
          <div class="empty-state-sub">상단 "엑셀 업로드" 버튼으로 파일을 올리면 회사별 현황이 표시됩니다.</div>
        </div>`;
      return;
    }

    // 고정 3개 회사 + 데이터에만 있는 그 외 회사(있다면)를 함께 표시
    const foundCompanies = [...new Set(allCases.map(c => c.creditor_company))];
    const companies = sortCompanies([...new Set([...COMPANY_ORDER, ...foundCompanies])]);

    grid.innerHTML = companies.map(name => {
      const rows = allCases.filter(c => c.creditor_company === name);
      const total = rows.length;
      const amount = rows.reduce((a, c) => a + (Number(c.amount) || 0), 0);
      const applyCount = rows.filter(c => c.status === '신청').length;
      const progressCount = rows.filter(c => c.status === '진행중').length;
      const doneCount = rows.filter(c => c.status === '종료').length;
      return `
        <div class="company-card" onclick="showCases('${jsStr(name)}')">
          <div class="company-card-top">
            <div class="company-name">${escapeHtml(name)}</div>
            <button class="icon-btn" title="이 회사 데이터 삭제" onclick="event.stopPropagation(); deleteCompany('${jsStr(name)}')">✕</button>
          </div>
          <div class="company-stat-row">
            <div class="company-stat"><div class="stat-label">신청 건수</div><div class="stat-value">${fmtNum(total)}건</div></div>
            <div class="company-stat"><div class="stat-label">총 채권추심금액</div><div class="stat-value">${fmtWon(amount)}</div></div>
          </div>
          <div class="status-chip-row">
            <span class="status-chip apply">신청 ${applyCount}</span>
            <span class="status-chip progress">진행중 ${progressCount}</span>
            <span class="status-chip done">종료 ${doneCount}</span>
          </div>
        </div>`;
    }).join('');
  }

  /* ---------- 사건 목록 ---------- */
  function renderCaseListHeader() {
    document.getElementById('caseListTitle').textContent = currentCompany;
    const rows = allCases.filter(c => c.creditor_company === currentCompany);
    const total = rows.length;
    const amount = rows.reduce((a, c) => a + (Number(c.amount) || 0), 0);
    document.getElementById('caseListSummary').innerHTML = `
      <div class="company-stat"><div class="stat-label">신청 건수</div><div class="stat-value">${fmtNum(total)}건</div></div>
      <div class="company-stat"><div class="stat-label">총 채권추심금액</div><div class="stat-value">${fmtWon(amount)}</div></div>`;
  }

  function renderCaseTable() {
    const thead = document.getElementById('caseThead');
    const tbody = document.getElementById('caseTbody');
    let rows = allCases.filter(c => c.creditor_company === currentCompany);
    if (currentFilter !== '전체') rows = rows.filter(c => c.status === currentFilter);

    const showClose = currentFilter === '종료';
    thead.innerHTML = `<tr>
      <th>회사명</th><th>사업자등록번호</th><th>대표자명</th><th>금액</th><th>상태</th><th>신청일자</th>
      ${showClose ? '<th>종료일자</th>' : ''}
      <th>비고</th>
    </tr>`;
    const colCount = showClose ? 8 : 7;

    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="${colCount}">${emptyMsg('해당 데이터가 없어요')}</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(c => `
      <tr onclick="showCaseDetail('${jsStr(c.case_no)}')">
        <td class="td-name">${escapeHtml(c.company_name)}</td>
        <td>${escapeHtml(c.business_reg_no || '-')}</td>
        <td>${escapeHtml(c.representative_name || '-')}</td>
        <td>${fmtWon(c.amount)}</td>
        <td>${buildStatusSelect(c)}</td>
        <td>${escapeHtml(c.apply_date || '-')}</td>
        ${showClose ? `<td>${escapeHtml(c.close_date || '-')}</td>` : ''}
        <td class="td-remark">
          <input type="text" class="remark-input" value="${escapeHtml(c.remark || '')}" placeholder="메모"
            onclick="event.stopPropagation()"
            onchange="updateRemark('${jsStr(c.case_no)}', this.value)">
        </td>
      </tr>`).join('');
  }

  /* ---------- 사건 상세 ---------- */
  function showCaseDetail(caseNo) {
    // creditor_company까지 같이 확인해서, 회사가 달라도 사건번호가 같은 경우 섞이지 않게 함
    const c = allCases.find(x => x.case_no === caseNo && x.creditor_company === currentCompany);
    if (!c) return;
    currentCaseNo = caseNo;

    showView('viewCaseDetail');
    document.getElementById('caseDetailTitle').textContent = c.company_name;
    document.getElementById('caseDetailBackLabel').textContent = currentCompany;

    document.getElementById('caseInfoGrid').innerHTML = `
      <div><div class="info-label">회사명</div><div class="info-value">${escapeHtml(c.company_name)}</div></div>
      <div><div class="info-label">사업자등록번호</div><div class="info-value">${escapeHtml(c.business_reg_no || '-')}</div></div>
      <div><div class="info-label">대표자명</div><div class="info-value">${escapeHtml(c.representative_name || '-')}</div></div>
      <div><div class="info-label">채권 금액</div><div class="info-value">${fmtWon(c.amount)}</div></div>
      <div><div class="info-label">상태</div><div class="info-value">${buildStatusSelect(c)}</div></div>
      <div><div class="info-label">신청일자</div><div class="info-value">${escapeHtml(c.apply_date || '-')}</div></div>
      <div style="grid-column:1/-1;"><div class="info-label">비고</div>
        <textarea class="remark-textarea" placeholder="메모" onchange="updateRemark('${jsStr(c.case_no)}', this.value)">${escapeHtml(c.remark || '')}</textarea>
      </div>
      ${c.close_date ? `<div><div class="info-label">종료일자</div><div class="info-value">${escapeHtml(c.close_date)}</div></div>` : ''}
    `;

    const rows = allProgress
      .filter(p => p.case_no === caseNo && p.creditor_company === currentCompany)
      .sort((a, b) => (a.progress_date || '').localeCompare(b.progress_date || ''));
    renderTimeline(rows);
  }

  function renderTimeline(rows) {
    const el = document.getElementById('timeline');
    if (!rows.length) { el.innerHTML = emptyMsg('등록된 진행 경과가 없어요'); return; }
    el.innerHTML = rows.map(r => `
      <div class="timeline-item">
        <span class="timeline-dot"></span>
        <span class="timeline-date">${escapeHtml(r.progress_date)}</span>
        ${statusChip(r.status)}
        ${r.note ? `<div class="timeline-note">${escapeHtml(r.note)}</div>` : ''}
      </div>`).join('');
  }

  /* ---------- 초기 로드 ---------- */
  async function init() {
    try {
      await loadFromSupabase();
      hideStatus();
      renderCompanies();
    } catch (err) {
      showError(err, '데이터를 불러오지 못했어요. Supabase URL/키와 테이블(collection_case, collection_progress)이 맞는지 확인해 주세요.');
      renderCompanies();
    }
  }
  document.addEventListener('DOMContentLoaded', init);
</script>

<script>
  /*
    ===== 미수현황 =====
    매월 회사별 미회수 엑셀(미수 발생 관리표)을 올리면 전체미수 / 악성미수를 보여줍니다.
    - 파일 속 "미수 발생 관리표" 시트(대상·디아이: 미수현황(전체), 픽스: 전체 미수현황)를 읽습니다.
    - 회사는 파일 이름(대상국제교역 / 디아이화스너 / 픽스글로벌)으로 구분합니다.
    - Supabase 테이블 receivable_monthly 에 회사 × 기준월 단위로 저장합니다.
      (supabase/receivable_monthly.sql 을 SQL Editor에서 먼저 실행해주세요)
      같은 회사·같은 기준월 파일을 다시 올리면 덮어씁니다.
    - 전월 대비: 같은 회사의 바로 이전 기준월 자료와 비교합니다. 거래처는 사업자번호(없으면 거래처명)로 맞춥니다.
      비고·처리결과 열이 없는 옛 양식(2026년 7월 이전)은 전체미수만 저장되고 악성 구분은 비교하지 않습니다.

    악성미수 분류 (거래처 1곳은 한 구분에만 들어감)
      1) 처리결과 칸이 추심요청 / 해지요청 / 유지 로 시작하면 그 구분
      2) 그 외에 비고 칸에 "출고정지"가 들어 있으면 출고정지
      3) 나머지는 정상
  */
  const AR_TABLE = 'receivable_monthly';
  const AR_CATS = [
    { key: '출고정지', color: 'var(--cat1)' },
    { key: '해지요청', color: 'var(--cat2)' },
    { key: '유지',     color: 'var(--cat3)' },
    { key: '추심요청', color: 'var(--cat4)' },
  ];
  const AR_CAT_COLOR = Object.fromEntries(AR_CATS.map(c => [c.key, c.color]));

  let arSnapshots = [];      // receivable_monthly 행들
  let arMonthSel = null;     // 'YYYY-MM-DD'
  let arTab = '전체';
  let arCat = '악성전체';
  let arQuery = '';
  let arTSV = '';

  const arWon = n => Math.round(n || 0).toLocaleString('ko-KR');
  function arBig(n) {
    const a = Math.abs(n);
    if (a >= 1e8) return { v: (n / 1e8).toFixed(2).replace(/\.?0+$/, ''), u: '억원' };
    if (a >= 1e4) return { v: Math.round(n / 1e4).toLocaleString('ko-KR'), u: '만원' };
    return { v: arWon(n), u: '원' };
  }
  const arPct = (a, b) => b ? (a / b * 100).toFixed(1) + '%' : '–';
  const arNorm = v => String(v ?? '').replace(/\s+/g, '');
  const arIsNum = v => typeof v === 'number' && isFinite(v);
  const arMonthLabel = d => { const [y, m] = String(d).split('-'); return `${y}년 ${Number(m)}월`; };

  function arShowMsg(html) { const el = document.getElementById('arMsg'); el.innerHTML = html; el.style.display = html ? 'block' : 'none'; }

  function arClassify(note, result) {
    const g = arNorm(result);
    for (const k of ['추심요청', '해지요청', '유지']) if (g.startsWith(k)) return k;
    if (String(note ?? '').includes('출고정지')) return '출고정지';
    return null;
  }

  function arCompanyFromFile(fileName) {
    const base = fileName.replace(/\.[^.]+$/, '');
    const key = companyMatchKey(base);
    const known = COMPANY_ORDER.find(c => key.includes(companyMatchKey(c)));
    if (known) return known;
    throw new Error('파일 이름에서 회사를 알 수 없어요. 파일 이름에 대상국제교역 / 디아이화스너 / 픽스글로벌 중 하나를 넣어주세요.');
  }

  function arParseWorkbook(wb, fileName) {
    let sheetName = null, rows = null;
    for (const sn of wb.SheetNames) {
      const r = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: null, blankrows: true });
      if (r.slice(0, 3).some(row => arNorm(row?.[0]).includes('미수발생관리표'))) { sheetName = sn; rows = r; break; }
    }
    if (!rows) throw new Error('"미수 발생 관리표" 시트를 찾지 못했어요. 미수현황(전체) 시트가 있는 파일인지 확인해 주세요.');

    let baseDate = null;
    for (let i = 0; i < 8 && i < rows.length; i++) {
      const v = rows[i]?.[1];
      if (arNorm(rows[i]?.[0]).includes('기준월') && arIsNum(v)) {
        const p = XLSX.SSF.parse_date_code(v);
        baseDate = `${p.y}-${String(p.m).padStart(2, '0')}-${String(p.d).padStart(2, '0')}`;
        break;
      }
    }
    if (!baseDate) {
      const m = String(rows[0]?.[0] || '').match(/(\d{4})-(\d{2})-(\d{2})/);
      if (m) baseDate = `${m[1]}-${m[2]}-${m[3]}`;
    }
    if (!baseDate) throw new Error('기준월(기준일)을 찾지 못했어요.');

    const h = rows.findIndex(r => arNorm(r?.[0]) === '거래처명' && arNorm(r?.[1]).includes('사업자'));
    if (h < 0) throw new Error('"거래처명 / 사업자등록번호" 제목 행을 찾지 못했어요.');
    const hdr = rows[h].map(arNorm);
    const col = f => hdr.findIndex(f);
    const C = {
      biz: col(x => x.includes('사업자')),
      total: col(x => x.includes('총') && x.includes('미수')),
      note: col(x => x === '비고'),
      result: col(x => x.includes('처리결과')),
      longest: col(x => x.includes('최장')),
      elapsed: col(x => x.includes('경과')),
    };
    if (C.total < 0) throw new Error('총미수잔액 열을 찾지 못했어요.');
    const hasCat = C.note >= 0 && C.result >= 0;   // 옛 양식(비고·처리결과 없음)은 전체미수만 집계

    // 원본 상단의 구분별 합계 (비교용)
    const origBlock = {};
    for (let i = 0; i < h; i++) {
      const k = arNorm(rows[i]?.[0]);
      if (AR_CATS.some(c => c.key === k) && arIsNum(rows[i][1])) origBlock[k] = rows[i][1];
    }

    const customers = []; let fileTotal = null;
    for (let i = h + 1; i < rows.length; i++) {
      const r = rows[i]; if (!r) continue;
      const nm = arNorm(r[0]);
      const amt = r[C.total];
      // 합계 행 아래는 연체 요약 등 다른 표라서 읽지 않음
      if (nm === '합계' || nm === '소계') { if (arIsNum(amt)) fileTotal = amt; break; }
      if (!nm || nm === '0' || nm.startsWith('※') || !arIsNum(amt)) continue;
      customers.push({
        name: String(r[0]).trim(),
        biz: r[C.biz] ? String(r[C.biz]) : '',
        amount: amt,
        key: arKey(r[C.biz], r[0]),
        note: hasCat ? String(r[C.note] ?? '').trim() : '',
        result: hasCat ? String(r[C.result] ?? '').trim() : '',
        longest: C.longest >= 0 ? String(r[C.longest] ?? '') : '',
        elapsed: C.elapsed >= 0 && arIsNum(r[C.elapsed]) ? r[C.elapsed] : null,
        cat: hasCat ? arClassify(r[C.note], r[C.result]) : null,
      });
    }

    const total = customers.reduce((s, c) => s + c.amount, 0);
    const byCat = Object.fromEntries(AR_CATS.map(c => [c.key, { amt: 0, n: 0 }]));
    customers.forEach(c => { if (c.cat) { byCat[c.cat].amt += c.amount; byCat[c.cat].n++; } });
    const origSum = AR_CATS.reduce((a, c) => a + (origBlock[c.key] || 0), 0);

    return {
      company: arCompanyFromFile(fileName),
      base_date: baseDate,
      file_name: fileName,
      sheet_name: sheetName,
      total,
      customer_count: customers.filter(c => c.amount !== 0).length,
      by_cat: byCat,
      bad_customers: customers.filter(c => c.cat),
      checks: {
        row_count: customers.length,
        file_total: fileTotal,
        orig_sum: origSum || null,
        no_biz_count: customers.filter(c => !c.biz && c.amount > 0).length,
        has_category: hasCat,
        // 전월 대비용: 잔액이 있는 모든 거래처 [키, 거래처명, 미수잔액]
        amounts: customers.filter(c => c.amount !== 0).map(c => [c.key, c.name, c.amount]),
      },
    };
  }

  function arKey(biz, name) {
    const d = String(biz ?? '').replace(/\D/g, '');
    return d.length >= 10 ? d : 'n:' + arNorm(name);
  }

  function arSummary(s) {
    if (!s) return null;
    const bad = AR_CATS.reduce((a, c) => a + (s.by_cat?.[c.key]?.amt || 0), 0);
    const badN = AR_CATS.reduce((a, c) => a + (s.by_cat?.[c.key]?.n || 0), 0);
    const hasCat = s.checks?.has_category !== false;
    return { total: Number(s.total) || 0, bad, badN, byCat: s.by_cat || {}, custN: s.customer_count || 0, hasCat };
  }

  // 같은 회사의 바로 이전 기준월 자료
  function arPrevSnap(company, date) {
    return arSnapshots.filter(s => s.company === company && s.base_date < date)
      .sort((a, b) => b.base_date.localeCompare(a.base_date))[0] || null;
  }

  // 증감 표시: 미수는 늘면 빨강(▲), 줄면 초록(▼)
  function arDelta(cur, prev, opts) {
    if (prev == null || cur == null) return '<span class="ar-delta flat">–</span>';
    const d = cur - prev;
    const full = opts && opts.full;
    if (Math.abs(d) < 1) return '<span class="ar-delta flat">변동 없음</span>';
    const b = arBig(Math.abs(d));
    const txt = full ? arWon(Math.abs(d)) + '원' : b.v + b.u;
    const pct = opts && opts.pct && prev ? ` (${d > 0 ? '+' : '−'}${Math.abs(d / prev * 100).toFixed(1)}%)` : '';
    return `<span class="ar-delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${txt}${pct}</span>`;
  }
  const arMonthShort = d => d ? `${Number(String(d).split('-')[1])}월` : '';

  /* ---------- Supabase ---------- */
  async function arLoad() {
    const { data, error } = await db.from(AR_TABLE).select('*').order('base_date', { ascending: false });
    if (error) throw error;
    arSnapshots = (data || []).map(r => ({ ...r, company: normalizeCompanyName(r.company) }));
  }

  async function arHandleFiles(evt) {
    const files = [...evt.target.files];
    evt.target.value = '';
    if (!files.length) return;
    const label = document.getElementById('arUploadLabel');
    label.style.pointerEvents = 'none'; label.style.opacity = .6;
    const errs = [], parsed = [];
    arShowMsg('파일을 읽는 중...');
    for (const f of files) {
      try {
        const wb = XLSX.read(new Uint8Array(await f.arrayBuffer()), { type: 'array' });
        parsed.push(arParseWorkbook(wb, f.name));
      } catch (e) { errs.push(`${escapeHtml(f.name)}: ${escapeHtml(e.message)}`); }
    }
    let saveErr = null;
    if (parsed.length) {
      try {
        arShowMsg('저장하는 중...');
        const { error } = await db.from(AR_TABLE).upsert(
          parsed.map(p => ({ ...p, uploaded_at: new Date().toISOString() })),
          { onConflict: 'company,base_date' });
        if (error) throw error;
        await arLoad();
      } catch (e) {
        saveErr = e;
        // 저장이 안 되면 이 화면에서만이라도 보여줌
        parsed.forEach(p => {
          arSnapshots = arSnapshots.filter(s => !(s.company === p.company && s.base_date === p.base_date));
          arSnapshots.unshift(p);
        });
      }
      arMonthSel = parsed.map(p => p.base_date).sort().pop();
    }
    const msgs = [];
    if (saveErr) msgs.push(`⚠️ 공유 서버(Supabase)에 저장하지 못해 이 화면에서만 보입니다. receivable_monthly 테이블이 만들어졌는지 확인해 주세요.<span class="status-detail">${escapeHtml(saveErr.message || saveErr)}</span>`);
    if (errs.length) msgs.push('⚠️ 읽지 못한 파일<br>' + errs.join('<br>'));
    arShowMsg(msgs.join('<br><br>'));
    label.style.pointerEvents = ''; label.style.opacity = 1;
    arRender();
  }

  /* ---------- 화면 ---------- */
  function arSelectMonth(v) { arMonthSel = v; arRender(); }

  function arRender() {
    const months = [...new Set(arSnapshots.map(s => s.base_date))].sort().reverse();
    const sel = document.getElementById('arMonth');
    if (!months.includes(arMonthSel)) arMonthSel = months[0] || null;
    sel.innerHTML = months.length ? months.map(m => `<option value="${m}" ${m === arMonthSel ? 'selected' : ''}>${arMonthLabel(m)}</option>`).join('') : '<option>기준월 없음</option>';
    sel.disabled = !months.length;

    const body = document.getElementById('arBody');
    if (!arMonthSel) {
      document.getElementById('arSub').textContent = '매월 회사별 미회수 엑셀을 올리면 전체미수와 악성미수를 보여줍니다.';
      body.innerHTML = `<div class="panel"><div class="empty-state">
        <div class="empty-state-title">아직 올린 미수 파일이 없어요</div>
        <div class="empty-state-sub">"미회수 파일 업로드"로 3개 회사 파일을 한 번에 올려주세요. (미수현황(전체) 시트가 들어 있는 파일)</div>
      </div></div>`;
      return;
    }

    const snaps = arSnapshots.filter(s => s.base_date === arMonthSel);
    const names = sortCompanies(snaps.map(s => s.company));
    const byName = Object.fromEntries(snaps.map(s => [s.company, s]));
    const sums = Object.fromEntries(names.map(n => [n, arSummary(byName[n])]));
    const missing = COMPANY_ORDER.filter(c => !names.includes(c));
    const prevByName = Object.fromEntries(names.map(n => [n, arPrevSnap(n, arMonthSel)]));
    const prevSums = Object.fromEntries(names.map(n => [n, arSummary(prevByName[n])]));
    const prevDates = [...new Set(names.map(n => prevByName[n]?.base_date).filter(Boolean))];
    const hasPrev = names.every(n => prevSums[n]);
    const curHasCat = names.every(n => sums[n].hasCat);
    const prevHasCat = hasPrev && names.every(n => prevSums[n].hasCat);
    const prevLabel = prevDates.length === 1 ? arMonthShort(prevDates[0]) : '전월';
    document.getElementById('arSub').textContent =
      `기준일 ${arMonthSel} · ${names.join(', ')}` + (missing.length ? ` (${missing.join(', ')} 파일 없음)` : '') +
      (hasPrev ? ` · 비교: ${prevDates.map(arMonthLabel).join(', ')}` : ' · 비교할 전월 자료 없음');

    const G = names.reduce((g, n) => { const s = sums[n]; g.total += s.total; g.bad += s.bad; g.badN += s.badN; g.custN += s.custN; return g; }, { total: 0, bad: 0, badN: 0, custN: 0 });
    const catSum = k => names.reduce((a, n) => a + (sums[n].byCat[k]?.amt || 0), 0);
    const catCnt = k => names.reduce((a, n) => a + (sums[n].byCat[k]?.n || 0), 0);
    const kpi = (label, n, sub, delta) => { const b = arBig(n); return `<div class="ar-kpi"><div class="stat-label">${label}</div><div class="stat-value">${b.v}<small>${b.u}</small></div><div class="stat-sub">${sub}</div>${delta ? `<div class="stat-delta">${delta}</div>` : ''}</div>`; };
    const kpiNA = (label, sub) => `<div class="ar-kpi"><div class="stat-label">${label}</div><div class="stat-value">–</div><div class="stat-sub">${sub}</div></div>`;
    const hj = catSum('해지요청'), cs = catSum('추심요청');
    const P = hasPrev ? names.reduce((g, n) => { const s = prevSums[n]; g.total += s.total; g.bad += s.bad; g.badN += s.badN; return g; }, { total: 0, bad: 0, badN: 0 }) : null;
    const pCat = k => names.reduce((a, n) => a + (prevSums[n]?.byCat[k]?.amt || 0), 0);
    const pCnt = k => names.reduce((a, n) => a + (prevSums[n]?.byCat[k]?.n || 0), 0);
    const vsPrev = html => `${prevLabel} 대비 ${html}`;
    const noPrevCat = hasPrev && !prevHasCat ? `${prevLabel} 파일엔 악성 구분이 없어 비교 불가` : '';

    // 회사별 막대 (같은 축)
    const max = Math.max(1, ...names.map(n => sums[n].total));
    const bars = names.map(n => {
      const s = sums[n];
      const segs = AR_CATS.filter(c => (s.byCat[c.key]?.amt || 0) > 0).map(c => {
        const a = s.byCat[c.key].amt;
        return `<div class="ar-seg" style="flex:0 0 ${a / max * 100}%;background:${c.color}" data-tip="${escapeHtml(`<b>${escapeHtml(n)} · ${c.key}</b><br>${arWon(a)}원 · ${s.byCat[c.key].n}곳<br>악성미수의 ${arPct(a, s.bad)}`)}"></div>`;
      }).join('');
      const normal = Math.max(0, s.total - s.bad);
      const normSeg = normal > 0 ? `<div class="ar-seg" style="flex:0 0 ${normal / max * 100}%;background:var(--cat-normal)" data-tip="${escapeHtml(`<b>${escapeHtml(n)} · 정상 미수</b><br>${arWon(normal)}원`)}"></div>` : '';
      return `<div class="ar-bar-row">
        <div class="ar-bar-name">${escapeHtml(n)}</div>
        <div class="ar-track">${segs}${normSeg}</div>
        <div class="ar-bar-meta"><span>전체 <b>${arWon(s.total)}</b>원 ${prevSums[n] ? arDelta(s.total, prevSums[n].total) : ''}</span>${s.hasCat ? `<span>악성 <b>${arWon(s.bad)}</b>원 (${arPct(s.bad, s.total)}, ${s.badN}곳) ${prevSums[n]?.hasCat ? arDelta(s.bad, prevSums[n].bad) : ''}</span>` : '<span>악성 구분 없음 (옛 양식)</span>'}</div>
      </div>`;
    }).join('');

    // 요약표
    const row = (label, s, cls) => `<tr class="${cls || ''}"><td>${escapeHtml(label)}</td><td class="r">${arWon(s.total)}</td><td class="r">${arWon(s.bad)}<span class="cnt">${s.badN}곳</span></td><td class="r">${arPct(s.bad, s.total)}</td>${
      AR_CATS.map(c => `<td class="r">${arWon(s.byCat[c.key]?.amt)}<span class="cnt">${s.byCat[c.key]?.n || 0}곳</span></td>`).join('')}</tr>`;
    const Gs = { ...G, byCat: Object.fromEntries(AR_CATS.map(c => [c.key, { amt: catSum(c.key), n: catCnt(c.key) }])) };
    const matrix = `<table class="ar-table"><thead><tr><th>회사</th><th class="r">전체미수</th><th class="r">악성미수</th><th class="r">악성비율</th>${
      AR_CATS.map(c => `<th class="r"><span class="ar-pill" style="--pc:${c.color}">${c.key}</span></th>`).join('')}</tr></thead><tbody>${
      names.map(n => row(n, sums[n])).join('')}${names.length > 1 ? row('합계', Gs, 'total') : ''}</tbody></table>`;
    const Ps = hasPrev ? { ...P, byCat: Object.fromEntries(AR_CATS.map(c => [c.key, { amt: pCat(c.key), n: pCnt(c.key) }])) } : null;
    const rowsFor = [...names.map(n => [n, sums[n], prevSums[n]]), ...(names.length > 1 ? [['합계', Gs, Ps]] : [])];
    arTSV = [['회사', '전체미수', '악성미수', '악성비율', ...AR_CATS.flatMap(c => [c.key + ' 금액', c.key + ' 건수']),
        ...(hasPrev ? [prevLabel + ' 전체미수', '전체미수 증감', ...(prevHasCat ? [prevLabel + ' 악성미수', '악성미수 증감'] : [])] : [])],
      ...rowsFor.map(([n, s, ps]) =>
        [n, Math.round(s.total), Math.round(s.bad), arPct(s.bad, s.total), ...AR_CATS.flatMap(c => [Math.round(s.byCat[c.key]?.amt || 0), s.byCat[c.key]?.n || 0]),
         ...(hasPrev ? [Math.round(ps.total), Math.round(s.total - ps.total), ...(prevHasCat ? [Math.round(ps.bad), Math.round(s.bad - ps.bad)] : [])] : [])])
    ].map(r => r.join('\t')).join('\n');

    // 전월 대비 증감 표
    const dRow = (label, s, ps, cls) => `<tr class="${cls || ''}"><td>${escapeHtml(label)}</td>
      <td class="r">${arWon(ps.total)}</td><td class="r">${arWon(s.total)}</td><td class="r">${arDelta(s.total, ps.total, { full: true, pct: true })}</td>
      ${prevHasCat && curHasCat
        ? `<td class="r">${arWon(ps.bad)}</td><td class="r">${arWon(s.bad)}</td><td class="r">${arDelta(s.bad, ps.bad, { full: true, pct: true })}</td>` +
          AR_CATS.map(c => `<td class="r">${arDelta(s.byCat[c.key]?.amt || 0, ps.byCat[c.key]?.amt || 0)}<span class="cnt">${(s.byCat[c.key]?.n || 0) - (ps.byCat[c.key]?.n || 0) >= 0 ? '+' : ''}${(s.byCat[c.key]?.n || 0) - (ps.byCat[c.key]?.n || 0)}곳</span></td>`).join('')
        : ''}</tr>`;
    const deltaTable = hasPrev ? `<table class="ar-table"><thead>
        <tr class="grp-row"><th></th><th class="grp" colspan="3">전체미수</th>${prevHasCat && curHasCat ? `<th class="grp" colspan="3">악성미수</th><th class="grp" colspan="4">구분별 증감</th>` : ''}</tr>
        <tr><th>회사</th><th class="r">${prevLabel}</th><th class="r">${arMonthShort(arMonthSel)}</th><th class="r">증감</th>
        ${prevHasCat && curHasCat ? `<th class="r">${prevLabel}</th><th class="r">${arMonthShort(arMonthSel)}</th><th class="r">증감</th>` +
          AR_CATS.map(c => `<th class="r"><span class="ar-pill" style="--pc:${c.color}">${c.key}</span></th>`).join('') : ''}</tr></thead>
        <tbody>${rowsFor.map(([n, s, ps], i) => dRow(n, s, ps, i === names.length ? 'total' : '')).join('')}</tbody></table>
        ${!prevHasCat ? `<div class="ar-foot">${prevLabel} 파일은 비고·처리결과 열이 없는 옛 양식이라 전체미수만 비교합니다. 악성미수 증감은 다음 달부터 보입니다.</div>` : ''}`
      : '';

    // 주요 변동 거래처 (미수잔액이 많이 늘거나 준 거래처)
    let movers = [];
    if (hasPrev) {
      names.forEach(n => {
        const cur = new Map((byName[n].checks?.amounts || []).map(([k, nm, a]) => [k, { nm, a }]));
        const prv = new Map((prevByName[n].checks?.amounts || []).map(([k, nm, a]) => [k, { nm, a }]));
        const catOf = new Map((byName[n].bad_customers || []).map(c => [c.key || arKey(c.biz, c.name), c.cat]));
        new Set([...cur.keys(), ...prv.keys()]).forEach(k => {
          const a = cur.get(k)?.a || 0, b = prv.get(k)?.a || 0;
          if (Math.abs(a - b) >= 1) movers.push({ company: n, name: cur.get(k)?.nm || prv.get(k)?.nm, cur: a, prev: b, d: a - b, cat: catOf.get(k) });
        });
      });
    }
    const hasAmounts = hasPrev && names.every(n => (byName[n].checks?.amounts || []).length && (prevByName[n].checks?.amounts || []).length);
    const up = movers.filter(m => m.d > 0).sort((a, b) => b.d - a.d).slice(0, 10);
    const down = movers.filter(m => m.d < 0).sort((a, b) => a.d - b.d).slice(0, 10);
    const moverTable = (list, title) => `<div style="min-width:0"><div class="info-label" style="margin-bottom:8px">${title}</div>
      <div class="table-scroll"><table class="ar-table"><thead><tr><th>회사</th><th>거래처명</th><th class="r">${prevLabel}</th><th class="r">${arMonthShort(arMonthSel)}</th><th class="r">증감</th></tr></thead><tbody>${
      list.length ? list.map(m => `<tr><td class="co">${escapeHtml(m.company)}</td><td class="td-name">${escapeHtml(m.name)}${m.cat ? ` <span class="ar-pill" style="--pc:${AR_CAT_COLOR[m.cat]};font-weight:600">${m.cat}</span>` : ''}</td><td class="r">${arWon(m.prev)}</td><td class="r">${arWon(m.cur)}</td><td class="r">${arDelta(m.cur, m.prev)}</td></tr>`).join('')
      : `<tr><td colspan="5">${emptyMsg('해당 거래처가 없어요')}</td></tr>`}</tbody></table></div></div>`;

    // 파일 점검
    const checks = names.map(n => {
      const s = byName[n], ck = s.checks || {}, sm = sums[n], flags = [];
      if (ck.file_total != null) {
        const diff = sm.total - ck.file_total;
        flags.push(Math.abs(diff) < 1
          ? `<div class="ar-flag ok">파일 합계행과 일치 (${arWon(ck.file_total)}원)</div>`
          : `<div class="ar-flag warn">파일 합계행 ${arWon(ck.file_total)}원 ≠ 거래처 합산 ${arWon(sm.total)}원 (차이 ${arWon(diff)}원). 합계 수식 범위 밖에 추가된 거래처가 있는지 확인해 주세요.</div>`);
      } else flags.push(`<div class="ar-flag warn">파일에서 합계/소계 행을 찾지 못해 비교하지 못했어요.</div>`);
      if (ck.orig_sum && Math.abs(ck.orig_sum - sm.bad) >= 1)
        flags.push(`<div class="ar-flag warn">원본 상단의 구분별 합계를 그대로 더하면 ${arWon(ck.orig_sum)}원이지만, 중복을 빼면 악성미수는 ${arWon(sm.bad)}원입니다.</div>`);
      if (ck.no_biz_count) flags.push(`<div class="ar-flag warn">사업자번호가 비어 있는 미수 거래처 ${ck.no_biz_count}곳</div>`);
      return `<div class="ar-check"><h3>${escapeHtml(n)}</h3>
        <div class="line"><span>파일</span><span style="text-align:right;word-break:break-all">${escapeHtml(s.file_name || '')}</span></div>
        <div class="line"><span>읽은 시트 / 행</span><span>${escapeHtml(s.sheet_name || '')} / ${ck.row_count ?? '-'}행</span></div>
        <div class="line"><span>올린 시각</span><span>${s.uploaded_at ? new Date(s.uploaded_at).toLocaleString('ko-KR') : '저장 안 됨'}</span></div>
        ${flags.join('')}</div>`;
    }).join('');

    body.innerHTML = `
      <div class="ar-kpis">
        ${kpi(`${names.length}사 전체미수`, G.total, `${arWon(G.total)}원 · 잔액 거래처 ${G.custN.toLocaleString()}곳`, hasPrev ? vsPrev(arDelta(G.total, P.total, { pct: true })) : '')}
        ${curHasCat ? kpi('악성미수', G.bad, `${arWon(G.bad)}원 · ${G.badN}곳`, prevHasCat ? vsPrev(arDelta(G.bad, P.bad, { pct: true })) + ` · ${G.badN - P.badN >= 0 ? '+' : ''}${G.badN - P.badN}곳` : noPrevCat)
          : kpiNA('악성미수', '이 달 파일엔 악성 구분이 없어요')}
        ${curHasCat ? `<div class="ar-kpi"><div class="stat-label">악성 비율</div><div class="stat-value">${arPct(G.bad, G.total)}</div><div class="stat-sub">전체미수 대비 악성미수</div>${prevHasCat ? `<div class="stat-delta">${prevLabel} ${arPct(P.bad, P.total)}</div>` : ''}</div>`
          : kpiNA('악성 비율', '이 달 파일엔 악성 구분이 없어요')}
        ${curHasCat ? kpi('해지·추심 요청', hj + cs, `해지 ${arBig(hj).v}${arBig(hj).u} · 추심 ${arBig(cs).v}${arBig(cs).u}`, prevHasCat ? vsPrev(arDelta(hj + cs, pCat('해지요청') + pCat('추심요청'))) : noPrevCat)
          : kpiNA('해지·추심 요청', '이 달 파일엔 악성 구분이 없어요')}
      </div>
      <div class="panel ar-panel">
        <div class="ar-panel-head"><h3 class="section-title">회사별 전체미수 중 악성미수</h3><p>막대 길이는 전체미수(같은 축), 색칠된 부분이 악성미수입니다.</p></div>
        <div class="ar-legend">${AR_CATS.map(c => `<span><i class="ar-sw" style="background:${c.color}"></i>${c.key}</span>`).join('')}<span><i class="ar-sw" style="background:var(--cat-normal)"></i>정상 미수</span></div>
        <div class="ar-bars">${bars}</div>
      </div>
      ${hasPrev ? `<div class="panel ar-panel">
        <div class="ar-panel-head"><h3 class="section-title">전월 대비 증감</h3><p>${prevDates.map(arMonthLabel).join(', ')} → ${arMonthLabel(arMonthSel)} · ▲ 증가(빨강) ▼ 감소(초록)</p></div>
        <div class="table-scroll">${deltaTable}</div>
        ${hasAmounts ? `<div class="ar-checks" style="grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:20px;margin-top:22px">
          ${moverTable(up, '미수가 가장 많이 늘어난 거래처 10곳')}${moverTable(down, '미수가 가장 많이 줄어든 거래처 10곳')}</div>`
          : `<div class="ar-foot">거래처별 증감은 두 달 모두 새 방식으로 올린 파일이 있어야 보여요. 해당 월 파일을 한 번 더 올려주세요.</div>`}
      </div>` : ''}
      <div class="panel ar-panel">
        <div class="ar-panel-head"><h3 class="section-title">보고용 요약표</h3>
          <button class="btn-secondary" id="arCopyBtn" onclick="arCopy()">표 복사 (엑셀 붙여넣기용)</button></div>
        <div class="table-scroll">${matrix}</div>
      </div>
      <div class="panel ar-panel">
        <div class="ar-panel-head"><h3 class="section-title">악성미수 거래처 명세</h3><p id="arDetailSum"></p></div>
        <div class="ar-controls">
          <div class="filter-tabs" style="margin:0" id="arTabs"></div>
          <input type="search" class="ar-search" id="arSearch" placeholder="거래처명 검색" aria-label="거래처명 검색" value="${escapeHtml(arQuery)}" oninput="arQuery=this.value;arRenderDetail()">
        </div>
        <div class="ar-chips" id="arChips"></div>
        <div class="ar-scroll"><table class="ar-table" id="arDetail"></table></div>
      </div>
      <div class="panel ar-panel">
        <details class="ar-details">
          <summary>파일 점검 · 분류 기준</summary>
          <div class="ar-checks">${checks}</div>
          <div class="ar-rule"><b>악성미수 분류 기준</b> (거래처 1곳은 한 구분에만 들어갑니다)
            <ol>
              <li>처리결과 칸이 <b>추심요청 / 해지요청 / 유지</b>로 시작하면 그 구분</li>
              <li>그 외에 비고 칸에 "출고정지"가 들어 있으면 <b>출고정지</b> (처리 방향 미정)</li>
              <li>나머지는 정상. 악성미수 = 네 구분의 합 (중복 없음)</li>
            </ol>
            같은 회사·같은 기준월 파일을 다시 올리면 덮어씁니다.
          </div>
        </details>
      </div>`;

    body.querySelectorAll('.ar-seg').forEach(el => {
      el.addEventListener('mouseenter', e => arTipShow(e, el.dataset.tip));
      el.addEventListener('mousemove', arTipMove);
      el.addEventListener('mouseleave', () => { document.getElementById('arTip').style.display = 'none'; });
    });
    arRenderDetail();
  }

  function arRenderDetail() {
    const snaps = arSnapshots.filter(s => s.base_date === arMonthSel);
    const names = sortCompanies(snaps.map(s => s.company));
    if (arTab !== '전체' && !names.includes(arTab)) arTab = '전체';
    document.getElementById('arTabs').innerHTML = ['전체', ...names].map(n =>
      `<button class="filter-tab ${n === arTab ? 'active' : ''}" onclick="arTab='${jsStr(n)}';arRenderDetail()">${escapeHtml(n)}</button>`).join('');

    const inTab = s => arTab === '전체' || s.company === arTab;
    const pool = [], gone = [];
    let prevCatKnown = true, anyPrev = false;
    snaps.filter(inTab).forEach(s => {
      const ps = arPrevSnap(s.company, arMonthSel);
      const prevAmt = new Map((ps?.checks?.amounts || []).map(([k, , a]) => [k, a]));
      const psHasCat = ps && ps.checks?.has_category !== false;
      if (ps) anyPrev = true;
      if (!psHasCat) prevCatKnown = false;
      const prevBad = new Map((psHasCat ? ps.bad_customers || [] : []).map(c => [c.key || arKey(c.biz, c.name), c]));
      const curAmt = new Map((s.checks?.amounts || []).map(([k, , a]) => [k, a]));
      const curBadKeys = new Set();
      (s.bad_customers || []).forEach(c => {
        const k = c.key || arKey(c.biz, c.name);
        curBadKeys.add(k);
        pool.push({ ...c, company: s.company, prevAmount: ps && prevAmt.size ? (prevAmt.get(k) || 0) : null, isNew: psHasCat && !prevBad.has(k) });
      });
      prevBad.forEach((c, k) => { if (!curBadKeys.has(k)) gone.push({ ...c, company: s.company, prevAmount: c.amount, amount: curAmt.get(k) || 0, gone: true }); });
    });
    const cnt = k => pool.filter(x => x.cat === k).length;
    const newN = pool.filter(x => x.isNew).length;
    const showGoneChip = anyPrev && prevCatKnown;
    if ((arCat === '신규' || arCat === '해소') && !showGoneChip) arCat = '악성전체';
    document.getElementById('arChips').innerHTML =
      `<button class="ar-chip ${arCat === '악성전체' ? 'active' : ''}" onclick="arCat='악성전체';arRenderDetail()">악성 전체 ${pool.length}</button>` +
      AR_CATS.map(c => `<button class="ar-chip ${arCat === c.key ? 'active' : ''}" onclick="arCat='${c.key}';arRenderDetail()"><i class="ar-sw" style="background:${c.color};width:8px;height:8px"></i>${c.key} ${cnt(c.key)}</button>`).join('') +
      (showGoneChip ? `<button class="ar-chip ${arCat === '신규' ? 'active' : ''}" onclick="arCat='신규';arRenderDetail()">전월 대비 신규 악성 ${newN}</button>` +
        `<button class="ar-chip ${arCat === '해소' ? 'active' : ''}" onclick="arCat='해소';arRenderDetail()">전월 대비 악성 해소 ${gone.length}</button>` : '');

    const q = arQuery.trim();
    const base = arCat === '해소' ? gone : arCat === '신규' ? pool.filter(x => x.isNew) : pool.filter(x => arCat === '악성전체' || x.cat === arCat);
    const list = base.filter(x => !q || x.name.includes(q)).sort((a, b) => arCat === '해소' ? b.prevAmount - a.prevAmount : b.amount - a.amount);
    document.getElementById('arDetailSum').textContent = arCat === '해소'
      ? `${list.length}곳 · 전월 악성 ${arWon(list.reduce((s, x) => s + x.prevAmount, 0))}원`
      : `${list.length}곳 · ${arWon(list.reduce((s, x) => s + x.amount, 0))}원`;
    const showCo = arTab === '전체';
    const cols = showCo ? 9 : 8;
    const noCatMonth = snaps.length && snaps.every(s => s.checks?.has_category === false);
    document.getElementById('arDetail').innerHTML = `<thead><tr><th>구분</th>${showCo ? '<th>회사</th>' : ''}<th>거래처명</th><th class="r">미수잔액</th><th class="r">전월 대비</th><th class="r">최장연체월</th><th class="r">경과개월</th><th>비고</th><th>처리결과</th></tr></thead><tbody>${
      list.length ? list.map(x => `<tr><td><span class="ar-pill" style="--pc:${AR_CAT_COLOR[x.cat]}">${x.cat}${x.gone ? ' → 해소' : ''}</span></td>${showCo ? `<td class="co">${escapeHtml(x.company)}</td>` : ''}<td class="td-name">${escapeHtml(x.name)}${x.isNew ? '<span class="ar-new">신규</span>' : ''}</td><td class="r">${arWon(x.amount)}</td><td class="r">${x.prevAmount == null ? '<span class="ar-delta flat">–</span>' : arDelta(x.amount, x.prevAmount)}</td><td class="r">${escapeHtml(x.gone ? '' : x.longest)}</td><td class="r">${x.gone ? '' : (x.elapsed ?? '')}</td><td class="note">${escapeHtml(x.note)}</td><td class="note">${escapeHtml(x.result)}</td></tr>`).join('')
      : `<tr><td colspan="${cols}">${emptyMsg(noCatMonth ? '이 달 파일은 비고·처리결과 열이 없는 옛 양식이라 악성 구분이 없어요' : '해당하는 거래처가 없어요')}</td></tr>`}</tbody>`;
  }

  function arTipShow(e, html) { const t = document.getElementById('arTip'); t.innerHTML = html; t.style.display = 'block'; arTipMove(e); }
  function arTipMove(e) { const t = document.getElementById('arTip'); t.style.left = Math.min(e.clientX + 14, innerWidth - t.offsetWidth - 8) + 'px'; t.style.top = (e.clientY + 14) + 'px'; }

  async function arCopy() {
    const btn = document.getElementById('arCopyBtn');
    try { await navigator.clipboard.writeText(arTSV); btn.textContent = '복사했어요'; }
    catch { btn.textContent = '복사 실패'; }
    setTimeout(() => { btn.textContent = '표 복사 (엑셀 붙여넣기용)'; }, 2000);
  }

  async function arInit() {
    try {
      await arLoad();
    } catch (err) {
      console.error(err);
      arShowMsg(`⚠️ 저장된 미수현황을 불러오지 못했어요. Supabase에 receivable_monthly 테이블이 있는지 확인해 주세요. (supabase/receivable_monthly.sql)<span class="status-detail">${escapeHtml(err?.message || err)}</span>`);
    }
    arRender();
  }
  document.addEventListener('DOMContentLoaded', arInit);
</script>
</body>
</html>
