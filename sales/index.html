<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>영업 대시보드</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    --color-bg: #ffffff;
    --color-surface: #ffffff;
    --color-border: #E7EAF0;
    --color-text: #10151F;
    --color-text-muted: #6B7280;
    --color-primary: #2454E0;
    --color-primary-dark: #16308C;
    --color-primary-soft: #EAF0FE;
    --color-primary-softer: #C7D9FB;
    --radius: 14px;
    --shadow-card: 0 1px 2px rgba(16,21,31,.04), 0 8px 24px -12px rgba(16,21,31,.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1280px; margin: 0 auto; padding: 32px 24px 60px; }
  .hub-link {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; font-weight: 600; color: var(--color-text-muted);
    text-decoration: none; margin-bottom: 20px;
  }
  .hub-link:hover { color: var(--color-primary); }
  /* 상단 툴바 (인사 대시보드와 동일 구성) */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    margin-bottom: 24px; padding: 14px 18px; background: #F2F3F5; border-radius: 12px;
  }
  .toolbar-info { font-size: 12.5px; color: var(--color-text-muted); font-weight: 600; }
  .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-primary, .btn-secondary {
    font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 9px 16px; border-radius: 999px;
    cursor: pointer; border: 1px solid transparent; display: inline-flex; align-items: center; gap: 6px;
    text-decoration: none;
  }
  .btn-primary { background: var(--color-primary); color: #fff; }
  .btn-primary:hover { background: var(--color-primary-dark); }
  .btn-secondary { background: #fff; color: var(--color-text); border-color: var(--color-border); }
  .btn-secondary:hover { border-color: var(--color-primary); color: var(--color-primary); }
  .page-header { margin-bottom: 28px; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  .subtitle { font-size: 13px; color: var(--color-text-muted); margin: 6px 0 0; }
  /* 회사 선택 + 기준월 */
  .scope-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: -12px 0 24px; }
  .base-month { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .base-month[hidden] { display: none; }
  .base-month-label { font-size: 12.5px; font-weight: 700; color: var(--color-text-muted); margin-right: 2px; }
  .nav-btn {
    font-family: inherit; font-size: 13px; font-weight: 700; width: 32px; height: 32px; border-radius: 999px;
    cursor: pointer; border: 1px solid var(--color-border); background: #fff; color: var(--color-text); flex: none;
  }
  .nav-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
  .nav-btn:disabled { opacity: .4; cursor: default; }
  .month-select {
    font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 6px 10px; border-radius: 999px;
    border: 1px solid var(--color-primary); background: #fff; color: var(--color-text); height: 32px;
  }
  .month-select:focus { outline: none; border-color: var(--color-primary-dark); }
  .small-btn {
    font-family: inherit; font-size: 12px; font-weight: 700; padding: 7px 13px; border-radius: 999px;
    cursor: pointer; border: 1px solid var(--color-border); background: #fff; color: var(--color-text);
  }
  .small-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
  .card {
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius); box-shadow: var(--shadow-card); padding: 20px 22px;
  }
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
  .kpi-label { font-size: 12.5px; color: var(--color-text-muted); margin: 0 0 8px; font-weight: 600; }
  .kpi-value { font-size: 22px; font-weight: 800; margin: 0; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .kpi-value .unit { font-size: 13px; font-weight: 600; color: var(--color-text-muted); margin-left: 4px; }
  .kpi--main .kpi-value--xl { font-size: 34px; }
  .kpi-sub { font-size: 12.5px; color: var(--color-text-muted); margin: 10px 0 0; }
  .kpi-sub strong { color: var(--color-primary); font-weight: 700; }
  .progress-track { margin-top: 12px; height: 8px; background: var(--color-primary-soft); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--color-primary); border-radius: 999px; transition: width .5s ease; }
  .charts-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 16px; align-items: stretch; }
  .chart-card h2, .rank-grid h2 { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
  .card-caption { font-size: 11.5px; color: var(--color-text-muted); margin: 0 0 14px; line-height: 1.5; }
  .kpi-sub.up { color: #0ca30c; font-weight: 700; }
  .kpi-sub.down { color: #d03b3b; font-weight: 700; }
  .chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
  .legend { display: flex; gap: 16px; margin-top: 12px; font-size: 12px; color: var(--color-text-muted); flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot--strong { background: var(--color-primary); }
  .dot--soft { background: var(--color-primary-softer); }
  .dash { width: 14px; height: 0; border-top: 2px dashed var(--color-primary-dark); display: inline-block; }
  svg .grid-line { stroke: var(--color-border); stroke-width: 1; }
  svg .axis-label { font-size: 11px; fill: var(--color-text-muted); }
  svg .axis-label--current { fill: var(--color-primary); font-weight: 700; }
  svg .bar-value { font-size: 11px; fill: var(--color-text); font-weight: 600; }
  svg .bar--soft { fill: var(--color-primary-softer); }
  svg .bar--current { fill: var(--color-primary); }
  svg .target-line { fill: none; stroke: var(--color-primary-dark); stroke-width: 2; stroke-dasharray: 6 5; opacity: .75; }
  svg .funnel-label { font-size: 13px; font-weight: 700; }
  svg .funnel-count { font-size: 11.5px; opacity: .9; }
  svg .funnel-rate { font-size: 11.5px; fill: var(--color-primary-dark); font-weight: 700; }
  svg .funnel-final { font-size: 13.5px; fill: var(--color-text); font-weight: 800; }
  .rank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .rank-list { display: flex; flex-direction: column; gap: 14px; }
  .rank-row { display: flex; align-items: center; gap: 12px; }
  .rank-no {
    width: 22px; height: 22px; flex: none; border-radius: 50%;
    background: var(--color-primary-soft); color: var(--color-primary-dark);
    font-size: 11.5px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .rank-body { flex: 1; min-width: 0; }
  .rank-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; gap: 8px; }
  .rank-name { font-weight: 600; color: var(--color-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-amount { font-weight: 700; color: var(--color-primary); font-variant-numeric: tabular-nums; flex: none; }
  .rank-track { height: 6px; background: var(--color-primary-soft); border-radius: 999px; overflow: hidden; }
  .rank-fill { height: 100%; background: var(--color-primary); border-radius: 999px; }
  .footnote { text-align: center; font-size: 11.5px; color: var(--color-text-muted); margin-top: 24px; }
  .empty { font-size: 13px; color: var(--color-text-muted); }
  .company-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .company-tab {
    border: 1px solid var(--color-border); background: #fff; color: var(--color-text-muted);
    font-weight: 700; font-size: 13px; padding: 8px 16px; border-radius: 999px; cursor: pointer;
    font-family: inherit; transition: background .15s, border-color .15s, color .15s;
  }
  .company-tab:hover { border-color: var(--color-primary); color: var(--color-primary); }
  .company-tab.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
  @media (max-width: 1024px) {
    .charts-grid { grid-template-columns: 1fr; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 640px) {
    .kpi-grid { grid-template-columns: 1fr; }
    .rank-grid { grid-template-columns: 1fr; }
    .kpi--main .kpi-value--xl { font-size: 28px; }
    .page { padding: 20px 16px 40px; }
    .toolbar { flex-direction: column; align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="page">
  <a class="hub-link" href="/">← 허브로 돌아가기</a>

  <div class="toolbar">
    <div class="toolbar-info" id="lastUpdated">마지막 업데이트 확인 중...</div>
    <div class="toolbar-actions">
      <button id="refreshBtn" class="btn-secondary" type="button">새로고침</button>
      <a href="/sales/upload/customers/" class="btn-secondary">거래처등록</a>
      <a href="/sales/upload/" class="btn-primary">엑셀 업로드</a>
    </div>
  </div>

  <header class="page-header">
    <h1>영업 대시보드</h1>
    <p class="subtitle" id="subtitle">데이터를 불러오는 중...</p>
  </header>

  <div class="scope-bar">
    <div class="company-tabs" id="companyTabs"></div>
    <div class="base-month" id="baseMonthWrap" hidden>
      <span class="base-month-label">기준월</span>
      <button class="nav-btn" id="prevMonthBtn" type="button" title="이전 달">&lsaquo;</button>
      <select class="month-select" id="baseMonthSelect" title="기준월 선택"></select>
      <button class="nav-btn" id="nextMonthBtn" type="button" title="다음 달">&rsaquo;</button>
      <button class="small-btn" id="latestMonthBtn" type="button">이번 달</button>
    </div>
  </div>
  <main>
    <section class="kpi-grid" id="kpiGrid"></section>
    <section class="charts-grid">
      <div class="card chart-card">
        <h2>월별 매출</h2>
        <div class="chart-wrap">
          <svg id="monthlyChart" viewBox="0 0 640 340" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
        <div class="legend">
          <span class="legend-item"><i class="dot dot--strong"></i>이번 달</span>
          <span class="legend-item"><i class="dot dot--soft"></i>이전 달</span>
          <span class="legend-item"><i class="dash"></i>목표</span>
        </div>
      </div>
      <div class="card chart-card">
        <h2>거래처 활성화 퍼널</h2>
        <p class="card-caption">영업단계(CRM) 데이터가 없어, 거래처 매출 활성도 흐름으로 구성했습니다.</p>
        <div class="chart-wrap">
          <svg id="funnelChart" viewBox="0 0 320 320" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </div>
    </section>
    <section class="rank-grid">
      <div class="card">
        <h2>매출증감율 상위 거래처</h2>
        <p class="card-caption">담당자 데이터가 없어, 전월대비 매출증감율 상위 거래처로 대체했습니다.</p>
        <div id="personRank" class="rank-list"></div>
      </div>
      <div class="card">
        <h2>매출액 상위 거래처</h2>
        <p class="card-caption">상품 데이터가 없어, 이번 달 매출액 상위 거래처로 대체했습니다.</p>
        <div id="productRank" class="rank-list"></div>
      </div>
    </section>
  </main>
  <p class="footnote">금액 단위: 만원</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;
  const db = createClient(
    "https://mcypzsammvrthfqihkwy.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jeXB6c2FtbXZydGhmcWloa3d5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzOTk1NzcsImV4cCI6MjEwMTk3NTU3N30.oUcfA-F0S9QHgpK56qvB0-aczx7AMPXDCtkVtNrJ3QM"
  );
  const fmt = (n) => Number(n || 0).toLocaleString('ko-KR');
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ---------- 회사 선택 (통합 / 대상국제교역 / 디아이화스너 / 픽스글로벌) ----------
  const REAL_COMPANIES = ['대상국제교역', '디아이화스너', '픽스글로벌'];
  const COMPANIES = ['통합', ...REAL_COMPANIES];
  const COMPANY_STORAGE_KEY = 'salesDashboardCompany';
  let selectedCompany = localStorage.getItem(COMPANY_STORAGE_KEY);
  if (!COMPANIES.includes(selectedCompany)) selectedCompany = '통합';

  function renderCompanyTabs() {
    const wrap = document.getElementById('companyTabs');
    wrap.innerHTML = COMPANIES.map((c) =>
      `<button type="button" class="company-tab${c === selectedCompany ? ' active' : ''}" data-company="${escapeHtml(c)}">${escapeHtml(c)}</button>`
    ).join('');
    wrap.querySelectorAll('.company-tab').forEach((btn) => {
      btn.addEventListener('click', () => {
        const next = btn.dataset.company;
        if (next === selectedCompany) return;
        selectedCompany = next;
        localStorage.setItem(COMPANY_STORAGE_KEY, selectedCompany);
        renderCompanyTabs();
        loadDashboard(true);
      });
    });
  }
  renderCompanyTabs();

  // 통합 탭: 회사별로 따로 저장된 sales_monthly/sales_pipeline/sales_rank 스냅샷을 합산합니다.
  function aggregateMonthlyAll(rows) {
    const byMonth = new Map(); // sort_order -> acc
    rows.forEach((r) => {
      const key = r.sort_order;
      if (!byMonth.has(key)) {
        byMonth.set(key, { month: r.month, sort_order: r.sort_order, revenue: 0, target: 0, targetMissing: false, total_customers: 0, _gw: 0, _gwWeight: 0 });
      }
      const acc = byMonth.get(key);
      acc.revenue += Number(r.revenue) || 0;
      if (r.target != null) acc.target += Number(r.target); else acc.targetMissing = true;
      acc.total_customers += Number(r.total_customers) || 0;
      if (r.avg_growth_rate != null) {
        acc._gw += Number(r.avg_growth_rate) * (Number(r.revenue) || 0);
        acc._gwWeight += Number(r.revenue) || 0;
      }
    });
    return [...byMonth.values()]
      .map((acc) => ({
        month: acc.month,
        sort_order: acc.sort_order,
        revenue: acc.revenue,
        target: acc.targetMissing ? null : acc.target,
        total_customers: acc.total_customers,
        avg_growth_rate: acc._gwWeight > 0 ? acc._gw / acc._gwWeight : null,
      }))
      .sort((a, b) => a.sort_order - b.sort_order);
  }
  // ---------- 기준월 선택 ----------
  // sales_monthly에는 연도 칸이 없어, 거래처×월 데이터(sales_customer_monthly)의 최근 연도를 사용합니다.
  let dataYear = new Date().getFullYear();
  let availableMonths = [];   // 선택 가능한 월 번호 목록 (sort_order)
  let selectedMonthNum = null; // null = 가장 최근 달
  const ymLabel = (m) => `${dataYear}년 ${m}월`;
  function baseMonthNum() {
    if (selectedMonthNum != null && availableMonths.includes(selectedMonthNum)) return selectedMonthNum;
    return availableMonths.length ? availableMonths[availableMonths.length - 1] : null;
  }
  function renderBaseMonthSelect() {
    const wrap = document.getElementById('baseMonthWrap');
    const sel = document.getElementById('baseMonthSelect');
    wrap.hidden = !availableMonths.length;
    sel.innerHTML = availableMonths.map((m) => `<option value="${m}">${ymLabel(m)}</option>`).join('');
    const base = baseMonthNum();
    if (base != null) sel.value = String(base);
    const i = availableMonths.indexOf(base);
    document.getElementById('prevMonthBtn').disabled = i <= 0;
    document.getElementById('nextMonthBtn').disabled = i === -1 || i >= availableMonths.length - 1;
  }
  document.getElementById('baseMonthSelect').addEventListener('change', (e) => {
    selectedMonthNum = Number(e.target.value);
    loadDashboard();
  });
  function shiftBaseMonth(delta) {
    const i = availableMonths.indexOf(baseMonthNum()) + delta;
    if (i < 0 || i >= availableMonths.length) return;
    selectedMonthNum = availableMonths[i];
    loadDashboard();
  }
  document.getElementById('prevMonthBtn').addEventListener('click', () => shiftBaseMonth(-1));
  document.getElementById('nextMonthBtn').addEventListener('click', () => shiftBaseMonth(1));
  document.getElementById('latestMonthBtn').addEventListener('click', () => { selectedMonthNum = null; loadDashboard(); });

  function updateLastUpdatedLabel(iso) {
    const el = document.getElementById('lastUpdated');
    if (!iso) { el.textContent = '아직 업로드된 데이터가 없어요'; return; }
    const s = new Date(iso).toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    el.textContent = '마지막 업데이트: ' + s;
  }

  // PostgREST는 한 번에 최대 1000행만 돌려주므로 나눠서 모두 받아옵니다.
  async function fetchAll(makeQuery) {
    const out = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await makeQuery().range(from, from + 999);
      if (error) throw error;
      out.push(...data);
      if (data.length < 1000) break;
    }
    return out;
  }

  // 선택한 기준월의 퍼널·상위 거래처를 거래처×월 데이터로 계산합니다
  // (매출자료 업로드 화면의 계산식과 동일 — 그래서 과거 달을 골라도 그 달 기준으로 볼 수 있습니다).
  function computeCompanyMonth(rows, prevM, currM, masterCount) {
    const prev = new Map(), curr = new Map();
    rows.forEach((r) => {
      const map = r.month_num === currM ? curr : (r.month_num === prevM ? prev : null);
      if (!map) return;
      const amt = Number(r.amount) || 0;
      if (map.has(r.biz)) map.get(r.biz).amount += amt; else map.set(r.biz, { name: r.name, amount: amt });
    });
    const hasPrev = prev.size > 0;
    const allBiz = new Set([...prev.keys(), ...curr.keys()]);
    let currSum = 0, activeCount = 0, growCount = 0, newCount = 0;
    const rates = [], parsed = [];
    allBiz.forEach((biz) => {
      const p = prev.get(biz), c = curr.get(biz);
      const prevAmt = p ? p.amount : 0, currAmt = c ? c.amount : 0;
      currSum += currAmt;
      if (currAmt > 0) activeCount++;
      let rate = null;
      if (prevAmt > 0) { rate = (currAmt - prevAmt) / prevAmt; rates.push(rate); if (rate > 0) growCount++; }
      else if (currAmt > 0) newCount++;
      parsed.push({ name: (c || p).name, prev: prevAmt, curr: currAmt, rate });
    });
    const total = masterCount > 0 ? masterCount : allBiz.size;
    return {
      currSum,
      funnel: [total, activeCount, hasPrev ? growCount + newCount : 0],
      avgRate: hasPrev && rates.length ? rates.reduce((a, b) => a + b, 0) / rates.length * 100 : null,
      gainers: hasPrev ? parsed.filter((r) => r.rate != null && r.prev >= 500000)
        .sort((a, b) => b.rate - a.rate).slice(0, 5)
        .map((r) => ({ kind: 'gainer', name: r.name, amount: Math.round(r.curr / 10000), rate: r.rate * 100 })) : [],
      sellers: [...parsed].sort((a, b) => b.curr - a.curr).slice(0, 5)
        .map((r) => ({ kind: 'seller', name: r.name, amount: Math.round(r.curr / 10000), rate: null })),
    };
  }

  const FUNNEL_STAGES = ['전체 거래처', '이번달 매출발생', '전월대비 매출증가'];

  async function loadDashboard(resetMonth) {
    const subtitle = document.getElementById('subtitle');
    subtitle.textContent = '데이터를 불러오는 중...';
    const isAll = selectedCompany === '통합';
    const companies = isAll ? REAL_COMPANIES : [selectedCompany];
    const scope = (q) => (isAll ? q : q.eq('company', selectedCompany));
    if (resetMonth) selectedMonthNum = null;
    try {
      const [monthlyRes, yearRes, updCmRes, updCustRes] = await Promise.all([
        scope(db.from('sales_monthly').select('*')).order('sort_order', { ascending: true }),
        scope(db.from('sales_customer_monthly').select('year')).order('year', { ascending: false }).limit(1),
        scope(db.from('sales_customer_monthly').select('updated_at')).order('updated_at', { ascending: false }).limit(1),
        scope(db.from('sales_customers').select('updated_at')).order('updated_at', { ascending: false }).limit(1),
      ]);
      if (monthlyRes.error) throw monthlyRes.error;
      const stamps = [updCmRes, updCustRes].map((r) => (r.data && r.data[0] ? r.data[0].updated_at : null)).filter(Boolean).sort();
      updateLastUpdatedLabel(stamps.length ? stamps[stamps.length - 1] : null);
      if (yearRes.data && yearRes.data[0]) dataYear = yearRes.data[0].year;

      let monthly = monthlyRes.data || [];
      if (isAll) monthly = aggregateMonthlyAll(monthly);
      availableMonths = monthly.map((m) => m.sort_order);
      renderBaseMonthSelect();
      const scopeLabel = isAll ? '통합' : selectedCompany;
      if (!monthly.length) {
        subtitle.textContent = scopeLabel + ' · 표시할 데이터가 없습니다.';
        document.getElementById('kpiGrid').innerHTML = '';
        document.getElementById('monthlyChart').innerHTML = '';
        document.getElementById('funnelChart').innerHTML = '';
        renderRank('personRank', [], 'gainer');
        renderRank('productRank', [], 'seller');
        return;
      }

      const base = baseMonthNum();
      // 기준월까지의 달만 보여주고, 목표가 비어 있는 달은 "전달 매출 × 105%"로 채웁니다.
      const visible = monthly.filter((m) => m.sort_order <= base).map((m, i, arr) => ({
        ...m,
        target: m.target != null ? Number(m.target) : (i > 0 ? Math.round(Number(arr[i - 1].revenue) * 1.05) : null),
      }));

      // 기준월·전달 거래처별 매출 + 회사별 등록 거래처 수
      const [cmRows, masterCounts] = await Promise.all([
        fetchAll(() => scope(db.from('sales_customer_monthly').select('company,biz,name,month_num,amount'))
          .eq('year', dataYear).in('month_num', [base - 1, base]).order('id', { ascending: true })),
        Promise.all(companies.map(async (c) => {
          const { count } = await db.from('sales_customers').select('id', { count: 'exact', head: true }).eq('company', c);
          return count || 0;
        })),
      ]);
      const results = companies.map((c, i) =>
        computeCompanyMonth(cmRows.filter((r) => r.company === c), base - 1, base, masterCounts[i]));

      const pipeline = FUNNEL_STAGES.map((stage, i) => ({ stage, count: results.reduce((s, r) => s + r.funnel[i], 0) }));
      // "전체 거래처"는 그 달 저장 당시 값(③ 객단가와 같은 기준)을 우선 사용합니다.
      const baseRow = visible[visible.length - 1];
      if (baseRow.total_customers > 0) pipeline[0].count = Number(baseRow.total_customers);
      const gainers = results.flatMap((r) => r.gainers).sort((a, b) => b.rate - a.rate).slice(0, 5);
      const sellers = results.flatMap((r) => r.sellers).sort((a, b) => b.amount - a.amount).slice(0, 5);
      const rateWeight = results.filter((r) => r.avgRate != null).reduce((s, r) => s + r.currSum, 0);
      const computedAvgRate = rateWeight > 0
        ? results.filter((r) => r.avgRate != null).reduce((s, r) => s + r.avgRate * r.currSum, 0) / rateWeight
        : null;

      renderKPI(visible, pipeline, computedAvgRate);
      renderMonthlyChart(visible);
      renderFunnel(pipeline);
      renderRank('personRank', gainers, 'gainer');
      renderRank('productRank', sellers, 'seller');
      subtitle.textContent = scopeLabel + ' · 기준월: ' + ymLabel(base);
    } catch (err) {
      console.error(err);
      subtitle.textContent = '데이터를 불러오지 못했습니다: ' + (err.message || String(err));
    }
  }
  function renderKPI(monthly, pipeline, computedAvgRate) {
    const cur = monthly[monthly.length - 1];
    const hasTarget = cur.target != null && cur.target > 0;
    const achievement = hasTarget ? (cur.revenue / cur.target) * 100 : 0;
    const remaining = hasTarget ? cur.target - cur.revenue : 0;
    const barWidth = Math.min(Math.max(achievement, 0), 100);

    // ③ 객단가: 매출 ÷ 전체 거래처수 (거래처 원장에 계약 건수 개념이 없어 이렇게 대체)
    const hasCustomerCount = cur.total_customers != null && cur.total_customers > 0;
    const totalCustomers = hasCustomerCount ? cur.total_customers : (pipeline[0] ? pipeline[0].count : 0);
    const avgDeal = totalCustomers > 0 ? Math.round(cur.revenue / totalCustomers) : 0;

    // ④ 매출 평균증감율: 계약 단계 데이터가 없어 거래처별 전월대비 증감율 평균으로 대체
    //    저장된 값이 없는 과거 달은 거래처×월 데이터로 계산한 값을 씁니다.
    const storedRate = cur.avg_growth_rate != null ? Number(cur.avg_growth_rate) : null;
    const rateValue = storedRate != null ? storedRate : computedAvgRate;
    const hasGrowthRate = rateValue != null;
    const growthRate = hasGrowthRate ? rateValue : 0;
    const growthDir = growthRate >= 0 ? 'up' : 'down';
    const growthSign = growthRate >= 0 ? '+' : '';

    document.getElementById('kpiGrid').innerHTML = `
      <div class="card kpi kpi--main">
        <p class="kpi-label">① 이번 달 매출 (${escapeHtml(cur.month)})</p>
        <p class="kpi-value kpi-value--xl">${fmt(cur.revenue)}<span class="unit">만원</span></p>
        <div class="progress-track"><div class="progress-fill" style="width:${barWidth}%"></div></div>
        <p class="kpi-sub">${hasTarget ? `목표 대비 <strong>${achievement.toFixed(1)}%</strong> 달성` : '비교할 전달 매출이 없어 목표가 없습니다'}</p>
      </div>
      <div class="card kpi">
        <p class="kpi-label">② 이번 달 목표 (전달×105%)</p>
        <p class="kpi-value">${hasTarget ? fmt(cur.target) + '<span class="unit">만원</span>' : '-'}</p>
        <p class="kpi-sub">${!hasTarget ? '-' : remaining > 0 ? '남은 금액 ' + fmt(remaining) + '만원' : '목표 초과 +' + fmt(Math.abs(remaining)) + '만원'}</p>
      </div>
      <div class="card kpi">
        <p class="kpi-label">③ 객단가 (매출 ÷ 전체 거래처수)</p>
        <p class="kpi-value">${fmt(avgDeal)}<span class="unit">만원</span></p>
        <p class="kpi-sub">전체 거래처 ${fmt(totalCustomers)}곳 기준</p>
      </div>
      <div class="card kpi">
        <p class="kpi-label">④ 매출 평균증감율</p>
        <p class="kpi-value">${hasGrowthRate ? `${growthSign}${growthRate.toFixed(1)}<span class="unit">%</span>` : '-'}</p>
        <p class="kpi-sub ${hasGrowthRate ? growthDir : ''}">거래처별 전월대비 증감율 평균</p>
      </div>
    `;
  }
  function renderMonthlyChart(monthly) {
    const svg = document.getElementById('monthlyChart');
    const W = 640, H = 340;
    const marginLeft = 46, marginRight = 16, marginTop = 24, marginBottom = 40;
    const plotW = W - marginLeft - marginRight;
    const plotH = H - marginTop - marginBottom;
    const n = monthly.length;
    const maxVal = Math.max(...monthly.map(m => Math.max(Number(m.revenue) || 0, Number(m.target) || 0))) * 1.15 || 1;
    const slot = plotW / n;
    const barW = slot * 0.5;
    const yFor = (v) => marginTop + plotH - (v / maxVal) * plotH;
    const xForCenter = (i) => marginLeft + i * slot + slot / 2;
    let gridLines = '';
    const ticks = 4;
    for (let t = 0; t <= ticks; t++) {
      const v = (maxVal / ticks) * t;
      const y = yFor(v);
      gridLines += `<line x1="${marginLeft}" y1="${y}" x2="${W - marginRight}" y2="${y}" class="grid-line" />`;
      gridLines += `<text x="${marginLeft - 8}" y="${y + 4}" class="axis-label" text-anchor="end">${fmt(Math.round(v))}</text>`;
    }
    let bars = '', xLabels = '';
    monthly.forEach((m, i) => {
      const x = marginLeft + i * slot + (slot - barW) / 2;
      const h = (m.revenue / maxVal) * plotH;
      const y = marginTop + plotH - h;
      const isCurrent = i === n - 1;
      bars += `
        <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" class="${isCurrent ? 'bar bar--current' : 'bar bar--soft'}">
          <title>${escapeHtml(m.month)}: ${fmt(m.revenue)}만원</title>
        </rect>
        <text x="${x + barW / 2}" y="${y - 8}" text-anchor="middle" class="bar-value">${fmt(m.revenue)}</text>
      `;
      xLabels += `<text x="${x + barW / 2}" y="${H - marginBottom + 20}" text-anchor="middle" class="axis-label ${isCurrent ? 'axis-label--current' : ''}">${escapeHtml(m.month)}</text>`;
    });
    // 목표가 없는 달(첫 달)은 목표선에서 빼고 이어 그립니다.
    const targetPoints = monthly.map((m, i) => (m.target != null ? `${xForCenter(i)},${yFor(m.target)}` : null)).filter(Boolean).join(' ');
    svg.innerHTML = `${gridLines}${bars}<polyline points="${targetPoints}" class="target-line" />${xLabels}`;
  }
  function lerpColor(light, dark, t) {
    const r = Math.round(light[0] + (dark[0] - light[0]) * t);
    const g = Math.round(light[1] + (dark[1] - light[1]) * t);
    const b = Math.round(light[2] + (dark[2] - light[2]) * t);
    return `rgb(${r},${g},${b})`;
  }
  function renderFunnel(pipeline) {
    const svg = document.getElementById('funnelChart');
    const W = 320;
    const n = pipeline.length;
    const bandH = 44, gap = 30, marginTop = 10;
    const H = marginTop + n * bandH + (n - 1) * gap + 40;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const maxCount = Math.max(...pipeline.map(p => p.count)) || 1;
    const maxWidth = W - 40;
    const cx = W / 2;
    const LIGHT = [201, 217, 251];
    const DARK = [22, 48, 140];
    let content = '';
    pipeline.forEach((p, i) => {
      const topCount = p.count;
      const bottomCount = i + 1 < n ? pipeline[i + 1].count : p.count;
      const topW = (topCount / maxCount) * maxWidth;
      const botW = (bottomCount / maxCount) * maxWidth;
      const yTop = marginTop + i * (bandH + gap);
      const yBottom = yTop + bandH;
      const t = n > 1 ? i / (n - 1) : 1;
      const fillColor = lerpColor(LIGHT, DARK, t);
      const textColor = t < 0.55 ? '#10151F' : '#FFFFFF';
      const x1 = cx - topW / 2, x2 = cx + topW / 2;
      const x3 = cx + botW / 2, x4 = cx - botW / 2;
      content += `
        <polygon points="${x1},${yTop} ${x2},${yTop} ${x3},${yBottom} ${x4},${yBottom}" fill="${fillColor}" />
        <text x="${cx}" y="${yTop + bandH / 2 - 4}" text-anchor="middle" class="funnel-label" style="fill:${textColor}">${escapeHtml(p.stage)}</text>
        <text x="${cx}" y="${yTop + bandH / 2 + 14}" text-anchor="middle" class="funnel-count" style="fill:${textColor}">${fmt(p.count)}건</text>
      `;
      if (i + 1 < n) {
        const rate = topCount > 0 ? (bottomCount / topCount) * 100 : 0;
        content += `<text x="${cx}" y="${yBottom + gap / 2 + 4}" text-anchor="middle" class="funnel-rate">▼ ${rate.toFixed(1)}%</text>`;
      }
    });
    const finalRate = pipeline[0].count > 0 ? (pipeline[n - 1].count / pipeline[0].count) * 100 : 0;
    const lastY = marginTop + n * bandH + (n - 1) * gap;
    content += `<text x="${cx}" y="${lastY + 26}" text-anchor="middle" class="funnel-final">최종 전환율 ${finalRate.toFixed(1)}%</text>`;
    svg.innerHTML = content;
  }
  function renderRank(containerId, items, mode) {
    const el = document.getElementById(containerId);
    if (!items.length) {
      el.innerHTML = '<p class="empty">데이터가 없습니다.</p>';
      return;
    }
    if (mode === 'gainer') {
      const maxRate = Math.max(...items.map(i => Math.abs(i.rate || 0))) || 1;
      el.innerHTML = items.map((item, idx) => {
        const width = (Math.abs(item.rate || 0) / maxRate) * 100;
        const sign = (item.rate || 0) >= 0 ? '▲ +' : '▼ ';
        return `
          <div class="rank-row">
            <span class="rank-no">${idx + 1}</span>
            <div class="rank-body">
              <div class="rank-top">
                <span class="rank-name">${escapeHtml(item.name)}</span>
                <span class="rank-amount" style="color:#0ca30c">${sign}${Math.abs(item.rate || 0).toFixed(1)}%</span>
              </div>
              <div class="rank-track"><div class="rank-fill" style="width:${width}%;background:#0ca30c"></div></div>
            </div>
          </div>
        `;
      }).join('');
      return;
    }
    const maxAmount = Math.max(...items.map(i => i.amount)) || 1;
    el.innerHTML = items.map((item, idx) => {
      const width = (item.amount / maxAmount) * 100;
      return `
        <div class="rank-row">
          <span class="rank-no">${idx + 1}</span>
          <div class="rank-body">
            <div class="rank-top">
              <span class="rank-name">${escapeHtml(item.name)}</span>
              <span class="rank-amount">${fmt(item.amount)}만원</span>
            </div>
            <div class="rank-track"><div class="rank-fill" style="width:${width}%"></div></div>
          </div>
        </div>
      `;
    }).join('');
  }
  document.getElementById('refreshBtn').addEventListener('click', loadDashboard);
  loadDashboard();
</script>
