<title>대시보드 허브</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root {
    --ink: #16181d;
    --sub: #6b7178;
    --line: #e7e8eb;
    --bg: #ffffff;
    --card-bg: #ffffff;
    --shadow: 0 1px 2px rgba(16,18,22,0.04), 0 8px 24px rgba(16,18,22,0.05);
    --shadow-hover: 0 2px 4px rgba(16,18,22,0.06), 0 16px 32px rgba(16,18,22,0.09);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 24px 80px;
  }

  header {
    width: 100%;
    max-width: 1040px;
    margin-bottom: 40px;
  }

  .eyebrow {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--sub);
    text-transform: uppercase;
    margin: 0 0 10px;
  }

  h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }

  .lede {
    font-size: 15px;
    color: var(--sub);
    margin: 0;
    line-height: 1.6;
  }

  .grid {
    width: 100%;
    max-width: 1040px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  a.card {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 28px;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px;
    min-height: 152px;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  a.card:hover,
  a.card:focus-visible {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
    border-color: #d7d9dd;
  }

  a.card:active {
    transform: translateY(0);
  }

  .card-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    background: var(--icon-bg, #f2f3f5);
  }

  .card-body h2 {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .card-body p {
    font-size: 13.5px;
    color: var(--sub);
    margin: 0;
    line-height: 1.5;
  }

  .card-arrow {
    position: absolute;
    top: 24px;
    right: 24px;
    color: #c4c7cc;
    font-size: 16px;
    transition: transform 0.15s ease, color 0.15s ease;
  }

  a.card:hover .card-arrow {
    transform: translate(2px, -2px);
    color: var(--sub);
  }

  footer {
    margin-top: 48px;
    font-size: 12.5px;
    color: #a2a6ac;
  }

  @media (max-width: 860px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 560px) {
    body { padding: 40px 18px 56px; }
    h1 { font-size: 24px; }
    .grid { grid-template-columns: 1fr; gap: 12px; }
    a.card { min-height: auto; padding: 20px; gap: 20px; }
  }
</style>

<header>
  <p class="eyebrow">Dashboard Hub</p>
  <h1>대시보드 모음</h1>
  <p class="lede">부서별 대시보드로 바로 이동하세요.</p>
</header>

<main class="grid">
  <a class="card" href="/sales">
    <div class="card-icon" style="--icon-bg:#eef2ff;">📊</div>
    <div class="card-body">
      <h2>영업</h2>
      <p>영업 실적과 파이프라인 현황</p>
    </div>
    <span class="card-arrow">↗</span>
  </a>

  <a class="card" href="/marketing">
    <div class="card-icon" style="--icon-bg:#fdf2f8;">📣</div>
    <div class="card-body">
      <h2>마케팅</h2>
      <p>캠페인 성과와 채널별 지표</p>
    </div>
    <span class="card-arrow">↗</span>
  </a>

  <a class="card" href="/customer">
    <div class="card-icon" style="--icon-bg:#ecfeff;">💬</div>
    <div class="card-body">
      <h2>고객</h2>
      <p>고객 현황과 만족도 지표</p>
    </div>
    <span class="card-arrow">↗</span>
  </a>

  <a class="card" href="/pl">
    <div class="card-icon" style="--icon-bg:#f0fdf4;">💰</div>
    <div class="card-body">
      <h2>손익</h2>
      <p>매출, 비용, 손익 현황</p>
    </div>
    <span class="card-arrow">↗</span>
  </a>

  <a class="card" href="/hr">
    <div class="card-icon" style="--icon-bg:#fffbeb;">👥</div>
    <div class="card-body">
      <h2>인사</h2>
      <p>인력 현황과 조직 지표</p>
    </div>
    <span class="card-arrow">↗</span>
  </a>

  <a class="card" href="/exec">
    <div class="card-icon" style="--icon-bg:#f5f3ff;">🧭</div>
    <div class="card-body">
      <h2>경영진</h2>
      <p>전사 핵심 지표 요약</p>
    </div>
    <span class="card-arrow">↗</span>
  </a>
</main>

<footer>대시보드가 아직 없는 페이지는 연결 시 404가 표시됩니다.</footer>
